<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory - SOT</title>

  <!-- PROTEKSI LOGIN INSTAN SEBELUM ELEMEN TAMPILAN DIDERENDER -->
  <script>
    (function checkAuth() {
      try {
        const session = localStorage.getItem("user");
        if (!session) {
          window.location.replace("login.html");
          return;
        }
        const userData = JSON.parse(session);
        if (!userData) {
          window.location.replace("login.html");
          return;
        }
        if (userData.akses) {
          const aks = userData.akses;
          const punyaAkses = (aks.item === "Y" || aks.inventory === "Y" || aks.acces === "Y" || aks.accesControl === "Y");
          if (!punyaAkses) {
            alert("Anda tidak memiliki hak akses ke modul Item Master.");
            window.location.replace("login.html");
          }
        }
      } catch (err) {
        console.error("Autentikasi gagal:", err);
        window.location.replace("login.html");
      }
    })();
  </script>

  <!-- IMPORT GLOBAL STYLES -->
  <link rel="stylesheet" href="global-header.css">
  <link rel="stylesheet" href="analisa.css">

  <!-- Tailwind CSS v4 Browser Build & Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    html, body { 
      font-family: 'Roboto', sans-serif; 
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    input[type="checkbox"] {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      width: 0.875rem;
      height: 0.875rem;
      border-radius: 9999px !important;
      border: 1px solid #dadce0;
      outline: none;
      cursor: pointer;
      position: relative;
      transition: all 0.15s ease-in-out;
      display: inline-block;
      vertical-align: middle;
    }

    input[type="checkbox"]:checked {
      background-color: #1a73e8;
      border-color: #1a73e8;
    }

    input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      top: 45%;
      left: 50%;
      width: 3.5px;
      height: 7px;
      border: solid white;
      border-width: 0 1.5px 1.5px 0;
      transform: translate(-50%, -50%) rotate(45deg);
    }

    @media (prefers-color-scheme: dark) {
      input[type="checkbox"] { border-color: #5f6368; }
      input[type="checkbox"]:checked { background-color: #8ab4f8; border-color: #8ab4f8; }
      input[type="checkbox"]:checked::after { border-color: #121212; }
    }

    .floating-scroll-area {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent !important; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.25); border-radius: 9999px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.5); }
    .custom-scroll::-webkit-scrollbar-corner { background: transparent; }

    @media (prefers-color-scheme: dark) {
      .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.25); }
      .custom-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.5); }
    }

    #global-header {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 9999;
      pointer-events: none;
    }
    #global-header > * { pointer-events: auto; }
    #global-header aside, #global-header .sidebar {
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body class="bg-[#f8f9fa] dark:bg-[#121212] text-[#202124] dark:text-[#e8eaed] h-screen h-[100dvh] font-['Roboto',sans-serif] flex overflow-hidden transition-colors duration-200">

  <div id="global-header"></div>

  <div id="main-content" class="flex-1 w-full h-full flex flex-col overflow-hidden">
    
    <!-- HEADER ATAS -->
    <header class="bg-white dark:bg-[#1e1e1e] border-b border-[#dadce0] dark:border-[#3c4043] px-3 sm:px-4 py-2 sticky top-0 z-40 flex items-center justify-between gap-2 shrink-0">
      <div class="flex items-center gap-2 shrink-0">
        <h2 class="font-bold text-xs sm:text-sm text-[#202124] dark:text-[#e8eaed]">Inventory</h2>
        <span id="viewModeBadge" class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-blue-500/10 text-blue-600 dark:text-blue-400 border border-blue-500/20">Casual View</span>
      </div>

      <div class="flex items-center gap-2 sm:gap-4 flex-1 justify-end max-w-xs sm:max-w-md">
        <!-- Total Baris Desktop -->
        <p class="text-[11px] text-[#5f6368] dark:text-[#9aa0a6] font-medium whitespace-nowrap hidden sm:inline-block">
          Total Item: <span id="totalDataCount" class="font-bold text-[#1a73e8] dark:text-[#8ab4f8]">0</span>
        </p>

        <!-- Input Search -->
        <div class="relative flex items-center w-full max-w-[150px] xs:max-w-[180px] sm:max-w-64">
          <svg class="absolute left-2.5 w-3.5 h-3.5 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <input type="text" id="globalSearchInput" onkeydown="if(event.key==='Enter') triggerGlobalSearch()" 
                 placeholder="Cari item, code, project..." 
                 class="w-full h-7 sm:h-8 bg-[#f1f3f4] dark:bg-[#2d2d2d] text-[#202124] dark:text-[#e8eaed] border border-[#dadce0] dark:border-[#3c4043] rounded-full pl-8 pr-6 text-xs outline-none focus:border-blue-500 transition-all" />
          <button id="btnClearSearch" onclick="clearGlobalSearch()" class="absolute right-2 text-slate-400 hover:text-slate-600 dark:hover:text-white text-xs hidden">✕</button>
        </div>

        <!-- Hamburger Button (Tombol 3 Garis) -->
        <div class="relative flex items-center shrink-0">
          <button type="button" id="hamburgerBtn" onclick="toggleHamburgerMenu(event)" class="h-7 w-7 sm:h-8 sm:w-8 rounded-lg border transition-all flex items-center justify-center bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border-emerald-500/30 hover:bg-emerald-500/20 cursor-pointer" title="Menu Opsi">
            <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
          </button>
          
          <div id="customDropdownMenu" class="hidden absolute right-0 top-full mt-1.5 w-48 sm:w-52 bg-white dark:bg-[#252525] rounded-xl shadow-2xl border border-[#dadce0] dark:border-[#3c4043] overflow-hidden py-1 z-[99999] text-xs">
            <div id="custom-hamburger-content"></div>
          </div>
        </div>

      </div>
    </header>

    <!-- KONTAINER UTAMA TEMPAT TAMPILAN DINAMIS (CASUAL & ANALISA) -->
    <div class="flex-1 w-full relative overflow-hidden">
      <main class="floating-scroll-area custom-scroll p-2 sm:p-4">
        <div id="dynamicContainer" class="max-w-[98vw] mx-auto space-y-4">
          <!-- Konten dirender secara dinamis oleh inventory.js -->
        </div>
      </main>
    </div>

  </div>

  <!-- MODAL FORM CRUD ITEM -->
  <div id="modal" class="fixed inset-0 bg-black/60 z-[10005] hidden flex items-center justify-center p-2 sm:p-4">
    <div class="bg-white dark:bg-[#1e1e1e] max-w-md w-full rounded-2xl shadow-2xl overflow-hidden border border-[#dadce0] dark:border-[#3c4043] max-h-[90dvh] flex flex-col">
      <div class="bg-[#f8f9fa] dark:bg-[#252525] px-4 sm:px-6 py-3.5 text-[#202124] dark:text-[#e8eaed] border-b border-[#f1f3f4] dark:border-[#3c4043] flex justify-between items-center shrink-0">
        <h3 id="modalTitle" class="font-bold text-sm sm:text-base">Form Master Item</h3>
        <button onclick="closeModal()" class="text-[#5f6368] dark:text-[#9aa0a6] hover:text-[#202124] dark:hover:text-white text-xl font-bold cursor-pointer">&times;</button>
      </div>

      <form id="itemForm" onsubmit="saveData(event)" class="p-4 sm:p-6 space-y-4 text-xs overflow-y-auto custom-scroll flex-1" autocomplete="off">
        <input type="hidden" id="editNo" />
        
        <div>
          <label class="block font-semibold text-[#5f6368] dark:text-[#9aa0a6] uppercase mb-1">Nama Item *</label>
          <input type="text" id="inputItem" required placeholder="Nama barang / item..." class="w-full bg-[#f1f3f4] dark:bg-[#2d2d2d] text-[#202124] dark:text-[#e8eaed] border border-[#dadce0] dark:border-[#3c4043] rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block font-semibold text-[#5f6368] dark:text-[#9aa0a6] uppercase mb-1">Code</label>
            <input type="text" id="inputCode" placeholder="Kode item..." class="w-full bg-[#f1f3f4] dark:bg-[#2d2d2d] text-[#202124] dark:text-[#e8eaed] border border-[#dadce0] dark:border-[#3c4043] rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block font-semibold text-[#5f6368] dark:text-[#9aa0a6] uppercase mb-1">Satuan</label>
            <input type="text" id="inputSatuan" placeholder="PCS, KG, Box..." class="w-full bg-[#f1f3f4] dark:bg-[#2d2d2d] text-[#202124] dark:text-[#e8eaed] border border-[#dadce0] dark:border-[#3c4043] rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block font-semibold text-[#5f6368] dark:text-[#9aa0a6] uppercase mb-1">Project</label>
          <input type="text" id="inputProject" placeholder="Nama project..." class="w-full bg-[#f1f3f4] dark:bg-[#2d2d2d] text-[#202124] dark:text-[#e8eaed] border border-[#dadce0] dark:border-[#3c4043] rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div class="pt-4 flex justify-between items-center border-t border-[#f1f3f4] dark:border-[#3c4043] mt-2 shrink-0">
          <div>
            <button type="button" id="btnDeleteInModal" onclick="deleteDataInModal()" class="px-3.5 py-2 bg-red-500/10 hover:bg-red-500/20 text-red-600 dark:text-red-400 rounded-lg font-semibold hidden transition cursor-pointer">
              🗑️ Hapus
            </button>
          </div>
          <div class="flex gap-2.5">
            <button type="button" onclick="closeModal()" class="px-3.5 py-2 bg-[#f1f3f4] dark:bg-[#2d2d2d] hover:bg-[#e8eaed] dark:hover:bg-[#3c4043] text-[#5f6368] dark:text-[#bdc1c6] rounded-lg font-semibold transition cursor-pointer">Batal</button>
            <button type="submit" class="px-4 py-2 bg-[#1a73e8] dark:bg-[#8ab4f8] hover:bg-[#1557b0] dark:hover:bg-[#a6c8ff] text-white dark:text-[#202124] rounded-lg font-semibold transition cursor-pointer">Simpan</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="header-template.js"></script>
  <script src="analisa.js"></script>
  <script src="inventory.js"></script>
</body>
</html>
