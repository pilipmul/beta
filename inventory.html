  <!-- Auth Guard LocalStorage -->
  <script>
    (function() {
      try {
        const session = localStorage.getItem("user");
        if (!session) {
          window.location.replace("https://sotpbc.vercel.app/login.html");
          return;
        }
        const userData = JSON.parse(session);
        if (!userData) {
          window.location.replace("https://sotpbc.vercel.app/login.html");
          return;
        }
        if (userData.akses) {
          const aks = userData.akses;
          const punyaAkses = (aks.item === "Y" || aks.inventory === "Y" || aks.acces === "Y" || aks.accesControl === "Y");
          if (!punyaAkses) {
            alert("Anda tidak memiliki hak akses ke modul Item Master.");
            window.location.replace("https://sotpbc.vercel.app/login.html");
          }
        }
      } catch (err) {
        console.error("Autentikasi gagal:", err);
        window.location.replace("https://sotpbc.vercel.app/login.html");
      }
    })();
  </script>

  <!-- JavaScript Logika inventory -->
  <script>
    // 1. INISIALISASI HEADER INSTAN
    const hamburgerActions = [
      {
        label: "Export CSV",
        icon: `<svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>`,
        onClick: "exportCSV()"
      }
    ];

    if (isSuperAdmin()) {
      hamburgerActions.unshift({
        label: "Tambah Item",
        icon: `<svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>`,
        onClick: "openModal('add')"
      });
    }

    renderHeader({
      subtitle: "Inventory & Stok Master",
      hamburgerItems: hamburgerActions
    });

    const SUPABASE_URL = 'https://sfblelnbczlvykqemhtm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_9k7sUNqlqhRqjkUtSNpFPQ_VAspSZT0';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const PAGE_SIZE = 200;
    let currentPage = 1;
    let totalRows = 0;
    let rawDataMap = new Map();
    let fetchedData = [];

    // State Filter & Sort
    let activeFilterColumn = null;
    let filterSelections = {}; 
    let tempDraftSelections = new Set(); 
    let allColumnUniqueOptions = []; 
    let sortConfig = { column: null, direction: null };

    let globalSearchQuery = '';

    function getNormalizedValue(val) {
      if (val === null || val === undefined || String(val).trim() === '' || String(val).trim() === '-') {
        return '(Blangko)';
      }
      return String(val).trim();
    }

    function isSuperAdmin() {
      try {
        const session = localStorage.getItem("user");
        if (!session) return false;
        const userData = JSON.parse(session);
        return userData && (userData.nama === "Dede Hidayat" || userData.username === "Dede Hidayat");
      } catch (err) {
        return false;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      fetchTableData();

      _supabase
        .channel('public:item')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'item' }, (payload) => {
          fetchTableData();
        })
        .subscribe();
    });

    document.addEventListener('click', (e) => {
      const popover = document.getElementById('filterPopover');
      if (popover && !popover.classList.contains('hidden') && !popover.contains(e.target) && !e.target.closest('button[onclick*="toggleFilterMenu"]')) {
        closeFilterPopover();
      }
    });

    function triggerGlobalSearch() {
      const val = document.getElementById('globalSearchInput').value.trim();
      globalSearchQuery = val;
      currentPage = 1;

      const btnClear = document.getElementById('btnClearSearch');
      if (val !== '') {
        btnClear.classList.remove('hidden');
      } else {
        btnClear.classList.add('hidden');
      }

      fetchTableData();
    }

    function clearGlobalSearch() {
      document.getElementById('globalSearchInput').value = '';
      document.getElementById('btnClearSearch').classList.add('hidden');
      globalSearchQuery = '';
      currentPage = 1;
      fetchTableData();
    }

    function applyFiltersToQuery(query) {
      if (globalSearchQuery !== '') {
        query = query.or(
          `item.ilike.%${globalSearchQuery}%,` +
          `code.ilike.%${globalSearchQuery}%,` +
          `satuan.ilike.%${globalSearchQuery}%,` +
          `coa.ilike.%${globalSearchQuery}%,` +
          `project.ilike.%${globalSearchQuery}%`
        );
      }

      for (const colKey in filterSelections) {
        const selectedValues = filterSelections[colKey];
        if (selectedValues && selectedValues.length > 0) {
          const hasBlangko = selectedValues.includes('(Blangko)');
          const nonBlangkoValues = selectedValues.filter(v => v !== '(Blangko)');

          if (hasBlangko && nonBlangkoValues.length > 0) {
            const inList = nonBlangkoValues.map(v => `"${v}"`).join(',');
            query = query.or(`${colKey}.in.(${inList}),${colKey}.is.null,${colKey}.eq.`);
          } else if (hasBlangko) {
            query = query.or(`${colKey}.is.null,${colKey}.eq.`);
          } else {
            query = query.in(colKey, nonBlangkoValues);
          }
        }
      }

      return query;
    }

    async function fetchTableData() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = `<tr><td colspan="7" class="px-6 py-12 text-center text-slate-500">Memuat data inventory dari Supabase...</td></tr>`;

      try {
        let countQuery = _supabase.from('item').select('*', { count: 'exact', head: true });
        countQuery = applyFiltersToQuery(countQuery);

        const { count, error: countErr } = await countQuery;
        if (countErr) throw countErr;

        totalRows = count || 0;

        if (totalRows === 0) {
          tbody.innerHTML = `<tr><td colspan="7" class="px-6 py-12 text-center text-slate-400">Tidak ditemukan item yang sesuai.</td></tr>`;
          updatePaginationUI();
          updateHeaderFilterIcons();
          return;
        }

        const totalPages = Math.ceil(totalRows / PAGE_SIZE) || 1;
        if (currentPage > totalPages) currentPage = totalPages;

        const fromIndex = (currentPage - 1) * PAGE_SIZE;
        const toIndex = fromIndex + PAGE_SIZE - 1;

        let dataQuery = _supabase.from('item').select('*');
        dataQuery = applyFiltersToQuery(dataQuery);

        if (sortConfig.column && sortConfig.direction) {
          dataQuery = dataQuery.order(sortConfig.column, { ascending: sortConfig.direction === 'asc' });
        } else {
          dataQuery = dataQuery.order('no', { ascending: true });
        }

        dataQuery = dataQuery.range(fromIndex, toIndex);

        const { data, error } = await dataQuery;
        if (error) throw error;

        fetchedData = data || [];
        rawDataMap.clear();
        fetchedData.forEach(row => rawDataMap.set(row.no, row));

        renderTable();

      } catch (err) {
        alert('Gagal mengambil data: ' + err.message);
      }
    }

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      if (fetchedData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="px-6 py-12 text-center text-slate-400">Tidak ada data yang sesuai filter.</td></tr>`;
        updatePaginationUI();
        updateHeaderFilterIcons();
        return;
      }

      const allowEdit = isSuperAdmin();

      fetchedData.forEach(row => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50/80 transition duration-150 odd:bg-white even:bg-slate-50/40';

        const projectText = escapeHtml(row.project || '-');
        const projectContent = allowEdit 
          ? `<button onclick="openModalForNo(${row.no})" class="inline-block w-auto max-w-full px-2.5 py-1 bg-blue-50 hover:bg-blue-100 text-blue-600 rounded-lg border border-blue-200 font-semibold text-xs transition cursor-pointer truncate" title="Edit Item #${row.no}">${projectText}</button>`
          : `<span class="text-slate-500 text-xs truncate">${projectText}</span>`;

        tr.innerHTML = `
          <td class="px-4 py-3 text-center text-slate-400 font-medium">${row.no}</td>
          <td class="px-4 py-3 font-semibold text-slate-900 break-words">${escapeHtml(row.item || '-')}</td>
          <td class="px-4 py-3 text-slate-600 truncate" title="${escapeHtml(row.code || '')}">${escapeHtml(row.code || '-')}</td>
          <td class="px-4 py-3 text-center text-slate-600 truncate">${escapeHtml(row.satuan || '-')}</td>
          <td class="px-4 py-3 text-slate-600 truncate" title="${escapeHtml(row.coa || '')}">${escapeHtml(row.coa || '-')}</td>
          <td class="px-4 py-3 text-center text-slate-800 font-bold bg-slate-50/50">${row.balance ?? 0}</td>
          <td class="px-4 py-3 text-center truncate">${projectContent}</td>
        `;
        tbody.appendChild(tr);
      });

      updatePaginationUI();
      updateHeaderFilterIcons();
    }

    function updateHeaderFilterIcons() {
      const columns = ['no', 'item', 'code', 'satuan', 'coa', 'balance', 'project'];
      columns.forEach(col => {
        const btn = document.getElementById(`filterBtn_${col}`);
        if (!btn) return;

        const isFiltered = filterSelections[col] && filterSelections[col].length > 0;
        const isSorted = sortConfig.column === col;

        if (isFiltered || isSorted) {
          btn.classList.add('text-amber-400', 'font-bold');
          btn.classList.remove('text-slate-300');
          
          if (isSorted) {
            btn.innerText = sortConfig.direction === 'asc' ? '▲' : '▼';
          } else {
            btn.innerText = '▼★';
          }
        } else {
          btn.classList.remove('text-amber-400', 'font-bold');
          btn.classList.add('text-slate-300');
          btn.innerText = '▼';
        }
      });
    }

    async function toggleFilterMenu(columnKey, event) {
      event.stopPropagation();
      activeFilterColumn = columnKey;

      const popover = document.getElementById('filterPopover');
      const rect = event.currentTarget.getBoundingClientRect();
      
      let leftPos = rect.left + window.scrollX - 100;
      if (leftPos < 8) leftPos = 8;
      const maxLeft = window.innerWidth - 250;
      if (leftPos > maxLeft) leftPos = maxLeft;

      popover.style.top = `${rect.bottom + window.scrollY + 4}px`;
      popover.style.left = `${leftPos}px`;

      document.getElementById('filterSearchInput').value = '';

      const currentActive = filterSelections[columnKey];
      if (currentActive && currentActive.length > 0) {
        tempDraftSelections = new Set(currentActive);
      } else {
        tempDraftSelections = new Set();
      }

      const container = document.getElementById('filterItemsList');
      container.innerHTML = `<div class="p-3 text-center text-slate-400 text-xs">Memuat seluruh opsi...</div>`;
      popover.classList.remove('hidden');

      try {
        let query = _supabase.from('item').select(columnKey);

        for (const col in filterSelections) {
          if (col !== columnKey) {
            const vals = filterSelections[col];
            if (vals && vals.length > 0) {
              const hasBlangko = vals.includes('(Blangko)');
              const nonBlangko = vals.filter(v => v !== '(Blangko)');

              if (hasBlangko && nonBlangko.length > 0) {
                const inList = nonBlangko.map(v => `"${v}"`).join(',');
                query = query.or(`${col}.in.(${inList}),${col}.is.null,${col}.eq.`);
              } else if (hasBlangko) {
                query = query.or(`${col}.is.null,${col}.eq.`);
              } else {
                query = query.in(col, nonBlangko);
              }
            }
          }
        }

        if (globalSearchQuery !== '') {
          query = query.or(
            `item.ilike.%${globalSearchQuery}%,` +
            `code.ilike.%${globalSearchQuery}%,` +
            `satuan.ilike.%${globalSearchQuery}%,` +
            `coa.ilike.%${globalSearchQuery}%,` +
            `project.ilike.%${globalSearchQuery}%`
          );
        }

        const { data, error } = await query;
        if (error) throw error;

        const uniqueSet = new Set((data || []).map(r => getNormalizedValue(r[columnKey])));
        allColumnUniqueOptions = Array.from(uniqueSet).sort((a, b) => {
          if (a === '(Blangko)') return 1;
          if (b === '(Blangko)') return -1;
          return a.localeCompare(b, undefined, { numeric: true });
        });

        if (!filterSelections[columnKey]) {
          tempDraftSelections = new Set(allColumnUniqueOptions);
        }

        renderFilterCheckboxes();

      } catch (err) {
        container.innerHTML = `<div class="p-2 text-center text-red-500 text-xs">Gagal memuat opsi</div>`;
      }
    }

    function closeFilterPopover() {
      document.getElementById('filterPopover').classList.add('hidden');
    }

    function renderFilterCheckboxes() {
      const container = document.getElementById('filterItemsList');
      const searchVal = document.getElementById('filterSearchInput').value.trim().toLowerCase();

      container.innerHTML = '';

      let visibleCount = 0;
      let visibleCheckedCount = 0;

      allColumnUniqueOptions.forEach(val => {
        if (searchVal && !val.toLowerCase().includes(searchVal)) return;

        visibleCount++;
        const isChecked = tempDraftSelections.has(val);
        if (isChecked) visibleCheckedCount++;

        const label = document.createElement('label');
        label.className = 'flex items-center gap-2 text-xs text-slate-700 hover:bg-slate-100 p-1 rounded cursor-pointer truncate';
        label.innerHTML = `
          <input type="checkbox" value="${escapeHtml(val)}" ${isChecked ? 'checked' : ''} onchange="handleCheckboxChange(this)" class="filter-cb rounded border-slate-300 text-blue-600 focus:ring-0" />
          <span class="truncate ${val === '(Blangko)' ? 'italic text-slate-400' : ''}" title="${escapeHtml(val)}">${escapeHtml(val)}</span>
        `;
        container.appendChild(label);
      });

      if (visibleCount === 0) {
        container.innerHTML = `<div class="p-3 text-center text-slate-400 text-xs">Opsi tidak ditemukan</div>`;
      }

      const selectAllCb = document.getElementById('selectAllCheckbox');
      selectAllCb.checked = (visibleCount > 0 && visibleCount === visibleCheckedCount);
    }

    function handleCheckboxChange(cb) {
      const val = cb.value;
      if (cb.checked) {
        tempDraftSelections.add(val);
      } else {
        tempDraftSelections.delete(val);
      }

      const cbs = document.querySelectorAll('.filter-cb');
      let allVisibleChecked = true;
      cbs.forEach(item => {
        if (!item.checked) allVisibleChecked = false;
      });
      document.getElementById('selectAllCheckbox').checked = allVisibleChecked;
    }

    function toggleSelectAllFilters(checked) {
      const cbs = document.querySelectorAll('.filter-cb');
      cbs.forEach(cb => {
        cb.checked = checked;
        if (checked) {
          tempDraftSelections.add(cb.value);
        } else {
          tempDraftSelections.delete(cb.value);
        }
      });
    }

    function clearFilterColumn() {
      delete filterSelections[activeFilterColumn];
      tempDraftSelections = new Set(allColumnUniqueOptions);
      document.getElementById('filterSearchInput').value = '';
      renderFilterCheckboxes();
      
      currentPage = 1;
      fetchTableData();
    }

    function applyFilter() {
      if (tempDraftSelections.size === 0 || tempDraftSelections.size === allColumnUniqueOptions.length) {
        delete filterSelections[activeFilterColumn];
      } else {
        filterSelections[activeFilterColumn] = Array.from(tempDraftSelections);
      }

      closeFilterPopover();
      currentPage = 1;
      fetchTableData();
    }

    function applySort(direction) {
      sortConfig = { column: activeFilterColumn, direction };
      closeFilterPopover();
      currentPage = 1;
      fetchTableData();
    }

    function updatePaginationUI() {
      const totalPages = Math.ceil(totalRows / PAGE_SIZE) || 1;
      
      const startRow = totalRows === 0 ? 0 : (currentPage - 1) * PAGE_SIZE + 1;
      const endRow = Math.min(currentPage * PAGE_SIZE, totalRows);

      document.getElementById('pageInfo').innerHTML = `Menampilkan <strong class="text-slate-700">${startRow} - ${endRow}</strong> dari <strong class="text-slate-700">${totalRows}</strong> baris ditemukan`;
      document.getElementById('totalPagesText').innerText = `/ ${totalPages}`;
      document.getElementById('jumpPageInput').value = currentPage;

      document.getElementById('btnPrev').disabled = (currentPage <= 1);
      document.getElementById('btnNext').disabled = (currentPage >= totalPages);
    }

    function changePage(delta) {
      const totalPages = Math.ceil(totalRows / PAGE_SIZE) || 1;
      const newPage = currentPage + delta;

      if (newPage >= 1 && newPage <= totalPages) {
        currentPage = newPage;
        fetchTableData();
      }
    }

    function jumpToPage() {
      const totalPages = Math.ceil(totalRows / PAGE_SIZE) || 1;
      const input = document.getElementById('jumpPageInput');
      let val = parseInt(input.value, 10);

      if (isNaN(val) || val < 1) val = 1;
      if (val > totalPages) val = totalPages;

      currentPage = val;
      fetchTableData();
    }

    function openModal(mode, data = null) {
      const modal = document.getElementById('modal');
      const form = document.getElementById('itemForm');
      const title = document.getElementById('modalTitle');
      const btnDelete = document.getElementById('btnDeleteInModal');

      form.reset();
      document.getElementById('editNo').value = '';

      const inputCoa = document.getElementById('inputCoa');
      const inputProject = document.getElementById('inputProject');
      const inputBalance = document.getElementById('inputBalance');

      if (mode === 'add') {
        title.innerText = 'Add Item Master';
        btnDelete.classList.add('hidden');

        inputCoa.readOnly = false;
        inputProject.readOnly = false;
        inputBalance.readOnly = false;
        inputCoa.classList.remove('cursor-not-allowed', 'bg-slate-100');
        inputProject.classList.remove('cursor-not-allowed', 'bg-slate-100');
        inputBalance.classList.remove('cursor-not-allowed', 'bg-slate-100');
      } else if (mode === 'edit' && data) {
        title.innerText = `Edit Item #${data.no}`;
        btnDelete.classList.remove('hidden');

        inputCoa.readOnly = true;
        inputProject.readOnly = true;
        inputBalance.readOnly = true;
        inputCoa.classList.add('cursor-not-allowed', 'bg-slate-100');
        inputProject.classList.add('cursor-not-allowed', 'bg-slate-100');
        inputBalance.classList.add('cursor-not-allowed', 'bg-slate-100');

        document.getElementById('editNo').value = data.no;
        document.getElementById('inputItem').value = data.item || '';
        document.getElementById('inputCode').value = data.code || '';
        document.getElementById('inputSatuan').value = data.satuan || '';
        document.getElementById('inputCoa').value = data.coa || '';
        document.getElementById('inputProject').value = data.project || '';
        document.getElementById('inputBalance').value = data.balance ?? 0;
      }

      modal.classList.remove('hidden');
    }

    function openModalForNo(no) {
      const data = rawDataMap.get(no);
      if (data) openModal('edit', data);
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
    }

    async function saveData(e) {
      e.preventDefault();

      const no = document.getElementById('editNo').value;
      const item = document.getElementById('inputItem').value.trim();
      const code = document.getElementById('inputCode').value.trim() || null;
      const satuan = document.getElementById('inputSatuan').value.trim() || null;

      try {
        if (no) {
          const payloadUpdate = {
            item,
            code,
            satuan
          };

          const { error } = await _supabase
            .from('item')
            .update(payloadUpdate)
            .eq('no', no);

          if (error) throw error;
        } else {
          const coa = document.getElementById('inputCoa').value.trim() || null;
          const project = document.getElementById('inputProject').value.trim() || null;
          const balanceVal = document.getElementById('inputBalance').value ? parseInt(document.getElementById('inputBalance').value, 10) : 0;

          const payloadInsert = {
            item,
            code,
            satuan,
            coa,
            project,
            balance: balanceVal
          };

          const { error } = await _supabase
            .from('item')
            .insert([payloadInsert]);

          if (error) throw error;
        }

        closeModal();
        fetchTableData();

      } catch (err) {
        alert('Gagal menyimpan item: ' + err.message);
      }
    }

    async function deleteDataInModal() {
      const no = document.getElementById('editNo').value;
      if (!no) return;

      if (!confirm(`Apakah Anda yakin ingin menghapus item #${no}?`)) return;

      try {
        const { error } = await _supabase
          .from('item')
          .delete()
          .eq('no', no);

        if (error) throw error;

        closeModal();
        fetchTableData();

      } catch (err) {
        alert('Gagal menghapus item: ' + err.message);
      }
    }

    async function exportCSV() {
      try {
        let query = _supabase.from('item').select('*');
        query = applyFiltersToQuery(query);
        query = query.order('no', { ascending: true });

        const { data, error } = await query;

        if (error) throw error;
        if (!data || data.length === 0) {
          alert('Tidak ada data untuk diunduh');
          return;
        }

        const headers = ['no', 'item', 'code', 'satuan', 'coa', 'balance', 'project'];
        const csvRows = [headers.join(',')];

        data.forEach(row => {
          const values = headers.map(header => {
            const val = row[header] ?? '';
            return `"${String(val).replace(/"/g, '""')}"`;
          });
          csvRows.push(values.join(','));
        });

        const csvContent = 'data:text/csv;charset=utf-8,' + csvRows.join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', `item_master_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

      } catch (err) {
        alert('Gagal mengunduh CSV: ' + err.message);
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
