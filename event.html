<!DOCTYPE html>
<html lang="id">
<head>
  <script>
    (function() {
      try {
        const session = localStorage.getItem("user");
        if (!session) {
          window.location.replace("https://sotpbc.vercel.app/login.html");
          return;
        }

        const userData = JSON.parse(session);
        if (!userData) {
          window.location.replace("https://sotpbc.vercel.app/login.html");
          return;
        }

        if (userData.akses) {
          const aks = userData.akses;
          const punyaAkses = (aks.log === "Y" || aks.event === "Y" || aks.acces === "Y" || aks.accesControl === "Y");
          
          if (!punyaAkses) {
            alert("Anda tidak memiliki hak akses ke modul Event.");
            window.location.replace("https://sotpbc.vercel.app/login.html");
          }
        }
      } catch (err) {
        console.error("Autentikasi gagal:", err);
        window.location.replace("https://sotpbc.vercel.app/login.html");
      }
    })();
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Event - SOT</title>
  
  <link rel="stylesheet" href="global-header.css">
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    html, body {
      font-family: 'Roboto', sans-serif;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      touch-action: manipulation;
    }

    input[type="checkbox"] {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      width: 1rem;
      height: 1rem;
      border-radius: 9999px !important;
      border: 1px solid #dadce0;
      outline: none;
      cursor: pointer;
      position: relative;
      transition: all 0.15s ease-in-out;
      display: inline-block;
      vertical-align: middle;
    }

    input[type="checkbox"]:checked {
      background-color: #1a73e8;
      border-color: #1a73e8;
    }

    input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      top: 45%;
      left: 50%;
      width: 4px;
      height: 8px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: translate(-50%, -50%) rotate(45deg);
    }

    @media (prefers-color-scheme: dark) {
      input[type="checkbox"] { border-color: #5f6368; }
      input[type="checkbox"]:checked { background-color: #8ab4f8; border-color: #8ab4f8; }
      input[type="checkbox"]:checked::after { border-color: #121212; }
    }

    .floating-scroll-area {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }

    .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent !important; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.2); border-radius: 9999px; }
    
    @media (prefers-color-scheme: dark) {
      .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); }
    }

    #global-header {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 9999;
      pointer-events: none;
    }
    #global-header > * { pointer-events: auto; }
  </style>
</head>
<body class="bg-[#f8f9fa] dark:bg-[#121212] text-[#202124] dark:text-[#e8eaed] h-screen h-[100dvh] flex overflow-hidden">

  <div id="global-header"></div>

  <div id="main-content" class="flex-1 w-full h-full flex flex-col overflow-hidden">
    
    <!-- HEADER RESPONSIVE -->
    <header class="bg-white dark:bg-[#1e1e1e] border-b border-[#dadce0] dark:border-[#3c4043] px-3 py-2 sticky top-0 z-40 flex items-center justify-between gap-2 shrink-0">
      <div class="flex items-center gap-2 shrink-0">
        <h2 class="font-bold text-sm text-[#202124] dark:text-[#e8eaed]">Event</h2>
        <span id="totalDataCount" class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-blue-50 dark:bg-blue-950/50 text-[#1a73e8] dark:text-[#8ab4f8] border border-blue-200 dark:border-blue-800">0</span>
      </div>

      <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
        <!-- Division Dropdown -->
        <div class="relative shrink-0">
          <button type="button" id="btnDivisionDropdown" onclick="toggleDivisionMenu(event)" title="Pilih Divisi"
                  class="w-9 h-9 bg-[#f1f3f4] dark:bg-[#2d2d2d] border border-[#dadce0] dark:border-[#3c4043] rounded-xl flex items-center justify-center text-[#1a73e8] dark:text-[#8ab4f8] active:scale-95 transition cursor-pointer">
            <span id="divisionIcon">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <path d="M19 3l-6 6"/><path d="M13.5 6.5l4 4"/><path d="M5 21l8-8-4-4-8 8a1 1 0 0 0 0 1.41L2.59 21A1 1 0 0 0 5 21z"/><path d="M7 15l2 2"/>
              </svg>
            </span>
          </button>

          <div id="divisionMenu" class="hidden absolute right-0 top-full mt-1.5 w-40 bg-white dark:bg-[#252525] border border-[#dadce0] dark:border-[#3c4043] rounded-2xl shadow-xl py-1 z-[99999] text-xs">
            <button type="button" onclick="selectDivisionOption('cleaning')" class="w-full px-3.5 py-2.5 text-left flex items-center gap-2.5 hover:bg-[#f1f3f4] dark:hover:bg-[#3c4043] text-[#202124] dark:text-[#e8eaed] transition">
              <svg class="w-4 h-4 text-[#1a73e8] dark:text-[#8ab4f8] shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                <path d="M19 3l-6 6"/><path d="M13.5 6.5l4 4"/><path d="M5 21l8-8-4-4-8 8a1 1 0 0 0 0 1.41L2.59 21A1 1 0 0 0 5 21z"/><path d="M7 15l2 2"/>
              </svg>
              <span class="font-medium">Cleaner</span>
            </button>
            <button type="button" onclick="selectDivisionOption('engineering')" class="w-full px-3.5 py-2.5 text-left flex items-center gap-2.5 hover:bg-[#f1f3f4] dark:hover:bg-[#3c4043] text-[#202124] dark:text-[#e8eaed] transition">
              <svg class="w-4 h-4 text-[#1a73e8] dark:text-[#8ab4f8] shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              </svg>
              <span class="font-medium">Engineering</span>
            </button>
            <button type="button" onclick="selectDivisionOption('security')" class="w-full px-3.5 py-2.5 text-left flex items-center gap-2.5 hover:bg-[#f1f3f4] dark:hover:bg-[#3c4043] text-[#202124] dark:text-[#e8eaed] transition">
              <svg class="w-4 h-4 text-[#1a73e8] dark:text-[#8ab4f8] shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
              </svg>
              <span class="font-medium">Security</span>
            </button>
          </div>
        </div>

        <!-- Mobile-friendly Search Bar -->
        <div class="relative flex items-center w-28 xs:w-36 sm:w-52">
          <svg class="absolute left-2.5 w-3.5 h-3.5 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <input type="text" id="globalSearchInput" autocomplete="off" onkeydown="if(event.key==='Enter') triggerGlobalSearch()" 
                 placeholder="Cari event..." 
                 class="w-full h-9 bg-[#f1f3f4] dark:bg-[#2d2d2d] text-[#202124] dark:text-[#e8eaed] border border-[#dadce0] dark:border-[#3c4043] rounded-full pl-8 pr-7 text-xs outline-none focus:border-blue-500 transition-all" />
          <button id="btnClearSearch" onclick="clearGlobalSearch()" class="absolute right-2.5 text-slate-400 hover:text-slate-600 dark:hover:text-white text-xs hidden">✕</button>
        </div>

        <!-- Hamburger Options -->
        <div class="relative flex items-center shrink-0">
          <button type="button" id="hamburgerBtn" class="h-9 w-9 rounded-xl border transition-all flex items-center justify-center bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border-emerald-500/30 active:scale-95 cursor-pointer" title="Menu Opsi">
            <svg class="w-4 h-4 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
          </button>
          
          <div id="customDropdownMenu" class="hidden absolute right-0 top-full mt-1.5 w-48 bg-white dark:bg-[#252525] rounded-2xl shadow-2xl border border-[#dadce0] dark:border-[#3c4043] overflow-hidden py-1 z-[99999] text-xs">
            <div id="custom-hamburger-content"></div>
          </div>
        </div>
      </div>
    </header>

    <!-- CONTENT WRAPPER -->
    <div class="flex-1 w-full relative overflow-hidden">
      <main class="floating-scroll-area custom-scroll p-2 sm:p-4">
        <div class="max-w-7xl mx-auto space-y-3">

          <div class="bg-white dark:bg-[#1e1e1e] border border-[#dadce0] dark:border-[#3c4043] rounded-2xl shadow-xs overflow-hidden">
            
            <!-- DESKTOP TABLE VIEW (md and up) -->
            <div class="hidden md:block relative w-full overflow-x-auto custom-scroll">
              <table class="w-full text-left border-collapse text-xs">
                <thead class="bg-[#f8f9fa] dark:bg-[#252525] text-[#5f6368] dark:text-[#bdc1c6] uppercase font-semibold tracking-wider border-b border-[#dadce0] dark:border-[#3c4043]">
                  <tr>
                    <th scope="col" class="p-2.5 w-[65px] text-center relative">
                      <div class="flex items-center justify-center gap-0.5"><span>ID</span><button id="btn-filter-id" onclick="toggleFilterMenu('id', event)"></button></div>
                    </th>
                    <th scope="col" class="p-2.5 w-[90px] relative">
                      <div class="flex items-center justify-between gap-0.5"><span>Waktu</span><button id="btn-filter-timestamp" onclick="toggleFilterMenu('timestamp', event)"></button></div>
                    </th>
                    <th scope="col" class="p-2.5 w-[120px] relative">
                      <div class="flex items-center justify-between gap-0.5"><span>User</span><button id="btn-filter-logged_by" onclick="toggleFilterMenu('logged_by', event)"></button></div>
                    </th>
                    <th scope="col" class="p-2.5 w-[120px] relative">
                      <div class="flex items-center justify-between gap-0.5"><span>Lokasi</span><button id="btn-filter-location" onclick="toggleFilterMenu('location', event)"></button></div>
                    </th>
                    <th scope="col" class="p-2.5 w-[120px] relative">
                      <div class="flex items-center justify-between gap-0.5"><span>Kategori</span><button id="btn-filter-category" onclick="toggleFilterMenu('category', event)"></button></div>
                    </th>
                    <th scope="col" class="p-2.5 w-[80px] text-center relative">
                      <div class="flex items-center justify-center gap-0.5"><span>Prioritas</span><button id="btn-filter-priority" onclick="toggleFilterMenu('priority', event)"></button></div>
                    </th>
                    <th scope="col" class="p-2.5 relative">
                      <div class="flex items-center justify-between gap-0.5"><span>Detail & Tindakan</span><button id="btn-filter-subject" onclick="toggleFilterMenu('subject', event)"></button></div>
                    </th>
                    <th scope="col" class="p-2.5 w-[75px] text-center relative">
                      <span>Bukti</span>
                    </th>
                    <th scope="col" class="p-2.5 w-[95px] text-center relative">
                      <div class="flex items-center justify-center gap-0.5"><span>Status</span><button id="btn-filter-status" onclick="toggleFilterMenu('status', event)"></button></div>
                    </th>
                  </tr>
                </thead>
                <tbody id="eventTableBody" class="divide-y divide-[#f1f3f4] dark:divide-[#2d2d2d] font-medium">
                  <tr>
                    <td colspan="9" class="p-6 text-center text-[#5f6368] dark:text-[#9aa0a6]">Memuat data...</td>
                  </tr>
                </tbody>
              </table>
            </div>

            <!-- MOBILE CARD VIEW (< md) -->
            <div id="mobileCardContainer" class="block md:hidden p-2 space-y-2.5 divide-y divide-[#f1f3f4] dark:divide-[#2d2d2d]">
              <div class="p-4 text-center text-[#5f6368] dark:text-[#9aa0a6] text-xs">Memuat data...</div>
            </div>

            <!-- Filter Popover -->
            <div id="filterPopover" class="fixed hidden z-[10005] w-60 bg-white dark:bg-[#252525] border border-[#dadce0] dark:border-[#3c4043] rounded-2xl shadow-xl p-3 text-xs">
              <div class="grid grid-cols-2 gap-2 mb-3 border-b border-[#f1f3f4] dark:border-[#3c4043] pb-3">
                <button onclick="applySort('asc')" class="flex items-center justify-center gap-1.5 px-3 py-2 bg-[#f1f3f4] dark:bg-[#2d2d2d] hover:bg-[#e8eaed] dark:hover:bg-[#2c384e] text-[#202124] dark:text-[#e8eaed] rounded-xl transition font-medium text-xs">
                  <span>↑</span> A-Z
                </button>
                <button onclick="applySort('desc')" class="flex items-center justify-center gap-1.5 px-3 py-2 bg-[#f1f3f4] dark:bg-[#2d2d2d] hover:bg-[#e8eaed] dark:hover:bg-[#2c384e] text-[#202124] dark:text-[#e8eaed] rounded-xl transition font-medium text-xs">
                  <span>↓</span> Z-A
                </button>
              </div>

              <div class="space-y-2">
                <input type="text" id="filterSearchInput" autocomplete="off" oninput="renderFilterCheckboxes()" placeholder="Cari item..." 
                       class="w-full bg-[#f1f3f4] dark:bg-[#2d2d2d] border border-[#dadce0] dark:border-[#3c4043] rounded-xl px-3 py-2 text-[#202124] dark:text-[#e8eaed] focus:outline-none text-xs" />
                <div class="flex justify-between items-center text-[11px] text-[#5f6368] dark:text-[#9aa0a6] px-1">
                  <label class="flex items-center gap-1.5 cursor-pointer">
                    <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAllFilters(this.checked)" />
                    Pilih Semua
                  </label>
                  <button onclick="clearFilterColumn()" class="text-[#1a73e8] dark:text-[#8ab4f8] font-medium">Reset</button>
                </div>

                <div id="filterItemsList" class="max-h-36 overflow-y-auto space-y-1 pr-1 border border-[#f1f3f4] dark:border-[#3c4043] rounded-xl p-1.5 bg-[#f8f9fa] dark:bg-[#1e1e1e] custom-scroll">
                </div>

                <div class="flex gap-2 pt-2 border-t border-[#f1f3f4] dark:border-[#3c4043]">
                  <button onclick="closeFilterPopover()" class="w-1/2 py-2 bg-[#f1f3f4] dark:bg-[#2d2d2d] text-[#5f6368] dark:text-[#bdc1c6] rounded-xl font-medium">Batal</button>
                  <button onclick="applyFilter()" class="w-1/2 py-2 bg-[#1a73e8] dark:bg-[#8ab4f8] text-white dark:text-[#202124] rounded-xl font-medium shadow-xs">Terapkan</button>
                </div>
              </div>
            </div>

            <!-- PAGINATION BAR -->
            <div class="flex flex-wrap justify-between items-center p-2.5 sm:p-3 bg-[#f8f9fa] dark:bg-[#252525] border-t border-[#dadce0] dark:border-[#3c4043] text-xs gap-2">
              <span id="pageInfo" class="text-[#5f6368] dark:text-[#9aa0a6] text-[11px] sm:text-xs">Menampilkan 0 data</span>
              
              <div class="flex items-center gap-2">
                <div class="flex items-center gap-1 text-[#5f6368] dark:text-[#9aa0a6]">
                  <span>Hal:</span>
                  <input type="number" id="jumpPageInput" min="1" 
                         onkeydown="if(event.key==='Enter') jumpToPage()"
                         class="w-10 sm:w-12 bg-white dark:bg-[#1e1e1e] border border-[#dadce0] dark:border-[#3c4043] rounded-lg px-1 py-1 text-center text-[#202124] dark:text-[#e8eaed] focus:outline-none" />
                  <span id="totalPagesText">/ 1</span>
                  <button onclick="jumpToPage()" 
                          class="px-2 py-1 bg-[#e8f0fe] dark:bg-[#2c384e] text-[#1a73e8] dark:text-[#8ab4f8] rounded-lg font-medium active:scale-95 transition">
                    Go
                  </button>
                </div>

                <div class="flex items-center gap-0.5">
                  <button id="btnHome" onclick="goToHome()" title="Pertama" class="px-2 py-1 text-[#5f6368] dark:text-[#9aa0a6] disabled:opacity-30 font-mono font-bold">|&lt;</button>
                  <button id="btnPrev" onclick="changePage(-1)" title="Sebelumnya" class="px-2 py-1 text-[#5f6368] dark:text-[#9aa0a6] disabled:opacity-30 font-mono font-bold">&lt;</button>
                  <button id="btnNext" onclick="changePage(1)" title="Berikutnya" class="px-2 py-1 text-[#5f6368] dark:text-[#9aa0a6] disabled:opacity-30 font-mono font-bold">&gt;</button>
                  <button id="btnEnd" onclick="goToEnd()" title="Terakhir" class="px-2 py-1 text-[#5f6368] dark:text-[#9aa0a6] disabled:opacity-30 font-mono font-bold">&gt;|</button>
                </div>
              </div>
            </div>
          </div>

        </div>
      </main>
    </div>

  </div>

  <!-- MODAL FORM EVENT (MOBILE BOTTOM SHEET STYLED) -->
  <div id="modal" class="fixed inset-0 bg-black/50 dark:bg-black/70 hidden backdrop-blur-xs flex justify-center items-end sm:items-center p-0 sm:p-4 z-[10005]">
    <div class="bg-white dark:bg-[#1e1e1e] border-t sm:border border-[#dadce0] dark:border-[#3c4043] rounded-t-3xl sm:rounded-3xl p-4 sm:p-6 w-full max-w-lg shadow-2xl space-y-4 max-h-[92dvh] overflow-y-auto custom-scroll">
      <div class="w-12 h-1.5 bg-gray-300 dark:bg-gray-600 rounded-full mx-auto sm:hidden mb-1"></div>
      <h3 id="modalTitle" class="text-base sm:text-lg font-bold text-[#202124] dark:text-[#f1f3f4]">Form Event Entry</h3>
      
      <form id="eventForm" onsubmit="saveData(event)" class="space-y-3.5 text-xs" autocomplete="off">
        <input type="hidden" id="editId" />
        <input type="hidden" id="inputLink" />
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block font-medium text-[#5f6368] dark:text-[#9aa0a6] mb-1">Lokasi / Zone</label>
            <input type="text" id="inputLocation" required placeholder="misal: Lobby Lt. 1" 
                   class="w-full bg-[#f1f3f4] dark:bg-[#2d2d2d] focus:bg-white dark:focus:bg-[#252525] border border-transparent focus:border-[#1a73e8] dark:focus:border-[#8ab4f8] rounded-xl px-3 py-2.5 text-[#202124] dark:text-[#e8eaed] focus:outline-none transition" />
          </div>
          <div>
            <label class="block font-medium text-[#5f6368] dark:text-[#9aa0a6] mb-1">Kategori</label>
            <select id="inputCategory" required 
                    class="w-full bg-[#f1f3f4] dark:bg-[#2d2d2d] focus:bg-white dark:focus:bg-[#252525] border border-transparent focus:border-[#1a73e8] dark:focus:border-[#8ab4f8] rounded-xl px-3 py-2.5 text-[#202124] dark:text-[#e8eaed] focus:outline-none transition">
              <option value="">-- Pilih Kategori --</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-medium text-[#5f6368] dark:text-[#9aa0a6] mb-1">Prioritas</label>
            <select id="inputPriority" required 
                    class="w-full bg-[#f1f3f4] dark:bg-[#2d2d2d] focus:bg-white dark:focus:bg-[#252525] border border-transparent focus:border-[#1a73e8] dark:focus:border-[#8ab4f8] rounded-xl px-3 py-2.5 text-[#202124] dark:text-[#e8eaed] focus:outline-none transition">
              <option value="Low">Low / Rutin</option>
              <option value="Medium">Medium</option>
              <option value="High">High / Kritis</option>
            </select>
          </div>
          <div>
            <label class="block font-medium text-[#5f6368] dark:text-[#9aa0a6] mb-1">Status</label>
            <select id="inputStatus" required 
                    class="w-full bg-[#f1f3f4] dark:bg-[#2d2d2d] focus:bg-white dark:focus:bg-[#252525] border border-transparent focus:border-[#1a73e8] dark:focus:border-[#8ab4f8] rounded-xl px-3 py-2.5 text-[#202124] dark:text-[#e8eaed] focus:outline-none transition">
              <option value="Open">Open</option>
              <option value="In Progress">In Progress</option>
              <option value="Resolved">Resolved</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block font-medium text-[#5f6368] dark:text-[#9aa0a6] mb-1">Subjek / Ringkasan</label>
          <input type="text" id="inputSubject" required placeholder="Ringkasan singkat masalah" 
                 class="w-full bg-[#f1f3f4] dark:bg-[#2d2d2d] focus:bg-white dark:focus:bg-[#252525] border border-transparent focus:border-[#1a73e8] dark:focus:border-[#8ab4f8] rounded-xl px-3 py-2.5 text-[#202124] dark:text-[#e8eaed] focus:outline-none transition" />
        </div>

        <div>
          <label class="block font-medium text-[#5f6368] dark:text-[#9aa0a6] mb-1">Detail / Penjelasan</label>
          <textarea id="inputDetails" rows="3" required placeholder="Penjelasan lengkap mengenai kejadian..." 
                    class="w-full bg-[#f1f3f4] dark:bg-[#2d2d2d] focus:bg-white dark:focus:bg-[#252525] border border-transparent focus:border-[#1a73e8] dark:focus:border-[#8ab4f8] rounded-xl px-3 py-2.5 text-[#202124] dark:text-[#e8eaed] focus:outline-none transition"></textarea>
        </div>

        <div>
          <label class="block font-medium text-[#5f6368] dark:text-[#9aa0a6] mb-1">Tindakan yang Diambil</label>
          <input type="text" id="inputActionTaken" placeholder="Tindakan perbaikan atau mitigasi (Opsional)" 
                 class="w-full bg-[#f1f3f4] dark:bg-[#2d2d2d] focus:bg-white dark:focus:bg-[#252525] border border-transparent focus:border-[#1a73e8] dark:focus:border-[#8ab4f8] rounded-xl px-3 py-2.5 text-[#202124] dark:text-[#e8eaed] focus:outline-none transition" />
        </div>

        <!-- LAMPIRAN / DOKUMENTASI -->
        <div>
          <label class="block font-medium text-[#5f6368] dark:text-[#9aa0a6] mb-1.5">Lampiran Foto Bukti</label>
          
          <div class="flex border-b border-[#dadce0] dark:border-[#3c4043] mb-2 text-[11px] font-medium">
            <button type="button" id="tabUpload" onclick="switchDocMode('upload')" class="px-3 py-2 border-b-2 border-[#1a73e8] text-[#1a73e8] dark:text-[#8ab4f8] font-bold">
              📁 Upload
            </button>
            <button type="button" id="tabCamera" onclick="switchDocMode('camera')" class="px-3 py-2 border-b-2 border-transparent text-[#5f6368] dark:text-[#9aa0a6]">
              📷 Kamera
            </button>
            <button type="button" id="tabUrl" onclick="switchDocMode('url')" class="px-3 py-2 border-b-2 border-transparent text-[#5f6368] dark:text-[#9aa0a6]">
              🔗 URL
            </button>
          </div>

          <div id="docSectionUpload" class="space-y-2">
            <div id="dropzonePhoto" class="border-2 border-dashed border-[#dadce0] dark:border-[#3c4043] hover:border-[#1a73e8] rounded-xl p-4 text-center cursor-pointer transition bg-[#f8f9fa] dark:bg-[#252525]">
              <p class="text-xs text-[#5f6368] dark:text-[#9aa0a6]">
                Ketuk untuk memilih foto atau <span class="text-[#1a73e8] font-semibold underline">pilih file</span>
              </p>
              <input type="file" id="fileInputPhoto" accept="image/*" class="hidden" onchange="handleFileSelected(this.files)" />
            </div>
          </div>

          <div id="docSectionCamera" class="hidden space-y-2">
            <div class="relative bg-black rounded-xl overflow-hidden aspect-video flex items-center justify-center border border-[#3c4043]">
              <video id="cameraVideo" autoplay playsinline class="w-full h-full object-cover"></video>
              <canvas id="cameraCanvas" class="hidden"></canvas>
            </div>
            <div class="flex items-center justify-between gap-2">
              <button type="button" onclick="toggleCameraFacing()" class="px-3 py-2 bg-[#f1f3f4] dark:bg-[#2d2d2d] rounded-xl text-xs font-medium active:scale-95">
                🔄 Putar Kamera
              </button>
              <button type="button" onclick="capturePhotoFromCamera()" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold active:scale-95 transition">
                📸 Ambil Foto
              </button>
            </div>
          </div>

          <div id="docSectionUrl" class="hidden space-y-2">
            <div class="flex gap-2">
              <input type="url" id="inputUrlLink" placeholder="https://..." class="flex-1 bg-[#f1f3f4] dark:bg-[#2d2d2d] border border-transparent rounded-xl px-3 py-2.5 text-xs outline-none focus:border-[#1a73e8]" />
              <button type="button" onclick="applyUrlLink()" class="px-3 py-2.5 bg-[#1a73e8] text-white rounded-xl text-xs font-medium">Tempel</button>
            </div>
          </div>

          <div id="previewContainerPhoto" class="hidden flex items-center justify-between bg-[#f8f9fa] dark:bg-[#2d2d2d] p-2 mt-2 rounded-xl border border-[#1a73e8]/30">
            <div class="flex items-center gap-2 overflow-hidden">
              <img id="imgPreviewPhoto" class="w-10 h-10 object-cover rounded-lg border border-[#dadce0] dark:border-[#3c4043]" src="" alt="preview">
              <span id="fileNamePhoto" class="text-xs truncate max-w-[160px] font-medium text-[#202124] dark:text-[#e8eaed]">File Selected</span>
            </div>
            <button type="button" onclick="removeSelectedFile()" class="text-xs text-red-500 font-semibold hover:underline shrink-0 p-1">Hapus</button>
          </div>
        </div>

        <div class="flex justify-between items-center pt-3 border-t border-[#f1f3f4] dark:border-[#3c4043]">
          <button type="button" id="btnDeleteInModal" onclick="deleteDataInModal()" 
                  class="px-3.5 py-2.5 bg-[#fce8e6] dark:bg-[#481c1d] hover:bg-[#fad2cf] dark:hover:bg-[#5c2426] text-[#d93025] dark:text-[#f28b82] rounded-xl font-medium hidden transition cursor-pointer">
            🗑️ Hapus
          </button>
          <div class="flex gap-2 ml-auto">
            <button type="button" onclick="closeModal()" class="px-4 py-2.5 bg-[#f1f3f4] dark:bg-[#2d2d2d] hover:bg-[#e8eaed] text-[#5f6368] dark:text-[#bdc1c6] rounded-xl font-medium cursor-pointer">
              Batal
            </button>
            <button type="submit" class="px-5 py-2.5 bg-[#1a73e8] dark:bg-[#8ab4f8] text-white dark:text-[#202124] rounded-xl font-medium shadow-md active:scale-95 transition cursor-pointer">
              Simpan
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL PREVIEW FOTO -->
  <div id="imageModal" class="hidden fixed inset-0 bg-black/85 z-[10006] flex items-center justify-center p-3 backdrop-blur-xs" onclick="closePhotoModal()">
    <div class="max-w-2xl w-full bg-white dark:bg-[#1e1e1e] rounded-2xl overflow-hidden shadow-2xl border border-[#dadce0] dark:border-[#3c4043]" onclick="event.stopPropagation()">
      <div class="px-4 py-3 bg-[#f8f9fa] dark:bg-[#252525] border-b border-[#dadce0] dark:border-[#3c4043] flex items-center justify-between text-xs font-bold">
        <span id="modalPhotoTitle" class="text-[#202124] dark:text-[#e8eaed]">Preview Foto Event</span>
        <button onclick="closePhotoModal()" class="text-xl p-1 cursor-pointer text-[#5f6368] hover:text-[#202124] dark:text-[#9aa0a6] dark:hover:text-white">&times;</button>
      </div>
      <div class="p-2 flex justify-center bg-zinc-950">
        <img id="modalImage" class="max-h-[75vh] object-contain rounded-lg" src="" alt="photo view">
      </div>
    </div>
  </div>

  <!-- MODAL EXPORT CSV -->
  <div id="exportModal" class="fixed inset-0 bg-black/50 dark:bg-black/70 hidden backdrop-blur-xs flex justify-center items-end sm:items-center p-0 sm:p-4 z-[10005]">
    <div class="bg-white dark:bg-[#1e1e1e] border-t sm:border border-[#dadce0] dark:border-[#3c4043] rounded-t-3xl sm:rounded-3xl p-4 sm:p-6 w-full max-w-md shadow-2xl space-y-4 max-h-[90dvh] overflow-y-auto custom-scroll text-xs">
      <div class="flex justify-between items-center border-b border-[#f1f3f4] dark:border-[#3c4043] pb-3">
        <h3 class="text-sm sm:text-base font-bold text-[#202124] dark:text-[#f1f3f4] flex items-center gap-2">
          <span>📥</span> Export CSV Event
        </h3>
        <button onclick="closeExportModal()" class="text-[#5f6368] dark:text-[#9aa0a6] hover:text-[#202124] dark:hover:text-white text-xl font-bold cursor-pointer">&times;</button>
      </div>

      <div class="space-y-3.5">
        <div>
          <label class="block font-medium text-[#5f6368] dark:text-[#9aa0a6] mb-1">Divisi Terpilih</label>
          <input type="text" id="exportDivisionText" readonly disabled class="w-full bg-[#f1f3f4] dark:bg-[#2d2d2d] border border-transparent rounded-xl px-3 py-2 text-[#202124] dark:text-[#e8eaed] font-bold capitalize" />
        </div>

        <div>
          <label class="block font-medium text-[#5f6368] dark:text-[#9aa0a6] mb-1">Periode Tanggal</label>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <div>
              <span class="text-[10px] text-[#5f6368] dark:text-[#9aa0a6] block mb-0.5">Mulai Tanggal:</span>
              <input type="date" id="exportStartDate" class="w-full bg-[#f1f3f4] dark:bg-[#2d2d2d] focus:bg-white dark:focus:bg-[#252525] border border-transparent focus:border-[#1a73e8] dark:focus:border-[#8ab4f8] rounded-xl px-2.5 py-2 text-[#202124] dark:text-[#e8eaed] focus:outline-none" />
            </div>
            <div>
              <span class="text-[10px] text-[#5f6368] dark:text-[#9aa0a6] block mb-0.5">Selesai Tanggal:</span>
              <input type="date" id="exportEndDate" class="w-full bg-[#f1f3f4] dark:bg-[#2d2d2d] focus:bg-white dark:focus:bg-[#252525] border border-transparent focus:border-[#1a73e8] dark:focus:border-[#8ab4f8] rounded-xl px-2.5 py-2 text-[#202124] dark:text-[#e8eaed] focus:outline-none" />
            </div>
          </div>
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-3 border-t border-[#f1f3f4] dark:border-[#3c4043]">
        <button type="button" onclick="closeExportModal()" class="px-4 py-2.5 bg-[#f1f3f4] dark:bg-[#2d2d2d] hover:bg-[#e8eaed] dark:hover:bg-[#3c4043] text-[#5f6368] dark:text-[#bdc1c6] rounded-xl font-medium transition cursor-pointer">
          Batal
        </button>
        <button type="button" onclick="processExportCSV()" class="px-4 py-2.5 bg-[#137333] dark:bg-[#81c995] hover:bg-[#0d652d] text-white dark:text-[#202124] rounded-xl font-medium flex items-center gap-1.5 shadow transition cursor-pointer">
          Unduh CSV
        </button>
      </div>
    </div>
  </div>

  <script src="header-template.js"></script>
  <script src="table-filter.js"></script>
  <script src="event.js"></script>
</body>
</html>
