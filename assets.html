<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assets Management</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Custom / Global Header Script -->
  <script src="header.js"></script>
</head>
<body class="bg-[#f8f9fa] dark:bg-[#121212] text-[#202124] dark:text-[#e8eaed] font-sans min-h-screen flex flex-col">

  <!-- CONTAINER UTAMA -->
  <main class="flex-grow p-4 md:p-6 max-w-7xl mx-auto w-full">
    
    <!-- BAR PENCARIAN GLOBAL & EXPORT -->
    <div class="mb-4 flex flex-col sm:flex-row gap-3 items-center justify-between">
      <div class="relative w-full sm:w-80">
        <input 
          type="text" 
          id="globalSearchInput" 
          onkeyup="if(event.key==='Enter') triggerGlobalSearch()"
          placeholder="Cari aset, site, lokasi, PIC..." 
          class="w-full pl-9 pr-8 py-2 bg-white dark:bg-[#1e1e1e] border border-[#dadce0] dark:border-[#3c4043] rounded-lg text-sm text-[#202124] dark:text-[#e8eaed] placeholder-[#5f6368] dark:placeholder-[#9aa0a6] focus:outline-none focus:border-[#1a73e8] dark:focus:border-[#8ab4f8] transition"
        />
        <svg class="w-4 h-4 absolute left-3 top-2.5 text-[#5f6368] dark:text-[#9aa0a6]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
        <button 
          id="btnClearSearch" 
          onclick="clearGlobalSearch()" 
          class="hidden absolute right-2.5 top-2.5 text-[#5f6368] dark:text-[#9aa0a6] hover:text-[#202124] dark:hover:text-[#e8eaed]"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- AREA TABEL -->
    <div class="bg-white dark:bg-[#1e1e1e] border border-[#dadce0] dark:border-[#3c4043] rounded-xl shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs border-collapse min-w-[800px]">
          <thead class="bg-[#f1f3f4] dark:bg-[#2d2d2d] text-[#5f6368] dark:text-[#bdc1c6] font-semibold uppercase tracking-wider border-b border-[#dadce0] dark:border-[#3c4043]">
            <tr>
              <th class="p-2.5 text-center w-16">
                <div class="flex items-center justify-center gap-1">
                  <span>No</span>
                </div>
              </th>
              <th class="p-2.5">
                <div class="flex items-center justify-between">
                  <span>Aset</span>
                  <button type="button" onclick="toggleFilterMenu('aset', event)" class="p-1 hover:bg-[#dadce0] dark:hover:bg-[#3c4043] rounded">
                    <svg class="w-3.5 h-3.5 text-[#5f6368] dark:text-[#9aa0a6]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/></svg>
                  </button>
                </div>
              </th>
              <th class="p-2.5 text-center">
                <div class="flex items-center justify-between">
                  <span>Site</span>
                  <button type="button" onclick="toggleFilterMenu('site', event)" class="p-1 hover:bg-[#dadce0] dark:hover:bg-[#3c4043] rounded">
                    <svg class="w-3.5 h-3.5 text-[#5f6368] dark:text-[#9aa0a6]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/></svg>
                  </button>
                </div>
              </th>
              <th class="p-2.5">
                <div class="flex items-center justify-between">
                  <span>Lokasi</span>
                  <button type="button" onclick="toggleFilterMenu('lokasi', event)" class="p-1 hover:bg-[#dadce0] dark:hover:bg-[#3c4043] rounded">
                    <svg class="w-3.5 h-3.5 text-[#5f6368] dark:text-[#9aa0a6]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/></svg>
                  </button>
                </div>
              </th>
              <th class="p-2.5">
                <div class="flex items-center justify-between">
                  <span>PIC</span>
                  <button type="button" onclick="toggleFilterMenu('pic', event)" class="p-1 hover:bg-[#dadce0] dark:hover:bg-[#3c4043] rounded">
                    <svg class="w-3.5 h-3.5 text-[#5f6368] dark:text-[#9aa0a6]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/></svg>
                  </button>
                </div>
              </th>
              <th class="p-2.5">
                <div class="flex items-center justify-between">
                  <span>Kondisi</span>
                  <button type="button" onclick="toggleFilterMenu('kondisi', event)" class="p-1 hover:bg-[#dadce0] dark:hover:bg-[#3c4043] rounded">
                    <svg class="w-3.5 h-3.5 text-[#5f6368] dark:text-[#9aa0a6]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/></svg>
                  </button>
                </div>
              </th>
              <th class="p-2.5 text-center w-20">Foto</th>
              <th class="p-2.5">Note</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- Data tabel akan di-render melalui app.js -->
          </tbody>
        </table>
      </div>

      <!-- PAGINASI -->
      <div class="p-3 bg-[#f8f9fa] dark:bg-[#252525] border-t border-[#dadce0] dark:border-[#3c4043] flex flex-col sm:flex-row items-center justify-between gap-3 text-xs">
        <span id="pageInfo" class="text-[#5f6368] dark:text-[#9aa0a6]">Menampilkan 0-0 dari 0 data</span>
        <div class="flex items-center gap-2">
          <button id="btnPrev" onclick="changePage(-1)" disabled class="px-3 py-1 bg-white dark:bg-[#1e1e1e] border border-[#dadce0] dark:border-[#3c4043] rounded text-[#202124] dark:text-[#e8eaed] hover:bg-[#f1f3f4] dark:hover:bg-[#2d2d2d] disabled:opacity-50 transition cursor-pointer">
            Prev
          </button>
          
          <div class="flex items-center gap-1 text-[#5f6368] dark:text-[#9aa0a6]">
            <span>Halaman</span>
            <input type="number" id="jumpPageInput" onchange="jumpToPage()" min="1" class="w-12 px-1.5 py-0.5 text-center border border-[#dadce0] dark:border-[#3c4043] rounded bg-white dark:bg-[#1e1e1e] text-[#202124] dark:text-[#e8eaed] focus:outline-none focus:border-[#1a73e8]" />
            <span id="totalPagesText">/ 1</span>
          </div>

          <button id="btnNext" onclick="changePage(1)" disabled class="px-3 py-1 bg-white dark:bg-[#1e1e1e] border border-[#dadce0] dark:border-[#3c4043] rounded text-[#202124] dark:text-[#e8eaed] hover:bg-[#f1f3f4] dark:hover:bg-[#2d2d2d] disabled:opacity-50 transition cursor-pointer">
            Next
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- POPOVER FILTER & SORT -->
  <div id="filterPopover" class="hidden absolute z-50 w-64 bg-white dark:bg-[#1e1e1e] border border-[#dadce0] dark:border-[#3c4043] rounded-lg shadow-xl p-3 text-xs">
    <div class="flex items-center justify-between pb-2 border-b border-[#f1f3f4] dark:border-[#2d2d2d] mb-2">
      <span class="font-semibold text-[#202124] dark:text-[#e8eaed]">Filter & Sort</span>
      <button onclick="closeFilterPopover()" class="text-[#5f6368] dark:text-[#9aa0a6] hover:text-[#202124] dark:hover:text-[#e8eaed]">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- OPSI URUTKAN -->
    <div class="flex gap-2 mb-3">
      <button onclick="applySort('asc')" class="flex-1 py-1.5 px-2 bg-[#f1f3f4] dark:bg-[#2d2d2d] hover:bg-[#e8eaed] dark:hover:bg-[#3c4043] rounded text-[#202124] dark:text-[#e8eaed] font-medium flex items-center justify-center gap-1">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"/></svg>
        Asc
      </button>
      <button onclick="applySort('desc')" class="flex-1 py-1.5 px-2 bg-[#f1f3f4] dark:bg-[#2d2d2d] hover:bg-[#e8eaed] dark:hover:bg-[#3c4043] rounded text-[#202124] dark:text-[#e8eaed] font-medium flex items-center justify-center gap-1">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h9m5-4v12m0 0l-4-4m4 4l4-4"/></svg>
        Desc
      </button>
    </div>

    <!-- PENCARIAN DALAM FILTER -->
    <input 
      type="text" 
      id="filterSearchInput" 
      onkeyup="renderFilterCheckboxes()" 
      placeholder="Cari dalam daftar..." 
      class="w-full px-2 py-1 mb-2 bg-[#f8f9fa] dark:bg-[#121212] border border-[#dadce0] dark:border-[#3c4043] rounded text-[#202124] dark:text-[#e8eaed] placeholder-[#5f6368] focus:outline-none focus:border-[#1a73e8]"
    />

    <!-- PILIH SEMUA -->
    <label class="flex items-center gap-2 p-1 hover:bg-[#f1f3f4] dark:hover:bg-[#2d2d2d] rounded cursor-pointer mb-1 border-b border-[#f1f3f4] dark:border-[#2d2d2d]">
      <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAllFilters(this.checked)" class="rounded border-[#dadce0] text-[#1a73e8] focus:ring-0" />
      <span class="font-medium text-[#202124] dark:text-[#e8eaed]">(Pilih Semua)</span>
    </label>

    <!-- DAFTAR ITEM CHECKBOX -->
    <div id="filterItemsList" class="max-h-40 overflow-y-auto space-y-0.5 my-1">
      <!-- Item checkbox di-render via app.js -->
    </div>

    <!-- TOMBOL AKSI FILTER -->
    <div class="flex justify-between items-center gap-2 pt-2 border-t border-[#f1f3f4] dark:border-[#2d2d2d] mt-2">
      <button onclick="clearFilterColumn()" class="text-[#d93025] dark:text-[#f28b82] hover:underline font-medium">Reset</button>
      <button onclick="applyFilter()" class="px-3 py-1 bg-[#1a73e8] dark:bg-[#8ab4f8] text-white dark:text-[#202124] font-medium rounded hover:opacity-90 transition">Terapkan</button>
    </div>
  </div>

  <!-- MODAL TAMBAH / EDIT ASSET -->
  <div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
    <div class="bg-white dark:bg-[#1e1e1e] border border-[#dadce0] dark:border-[#3c4043] rounded-xl shadow-2xl w-full max-w-lg overflow-hidden">
      <div class="flex items-center justify-between p-4 border-b border-[#f1f3f4] dark:border-[#2d2d2d]">
        <h3 id="modalTitle" class="font-semibold text-base text-[#202124] dark:text-[#e8eaed]">Tambah / Edit Asset</h3>
        <button onclick="closeModal()" class="text-[#5f6368] dark:text-[#9aa0a6] hover:text-[#202124] dark:hover:text-[#e8eaed]">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <form id="assetsForm" onsubmit="saveData(event)" class="p-4 space-y-3 text-xs">
        <input type="hidden" id="editNo" />

        <div>
          <label class="block font-medium mb-1 text-[#202124] dark:text-[#e8eaed]">Nama Aset *</label>
          <input type="text" id="inputAset" required class="w-full px-3 py-2 bg-[#f8f9fa] dark:bg-[#121212] border border-[#dadce0] dark:border-[#3c4043] rounded text-[#202124] dark:text-[#e8eaed] focus:outline-none focus:border-[#1a73e8]" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-medium mb-1 text-[#202124] dark:text-[#e8eaed]">Site</label>
            <input type="text" id="inputSite" class="w-full px-3 py-2 bg-[#f8f9fa] dark:bg-[#121212] border border-[#dadce0] dark:border-[#3c4043] rounded text-[#202124] dark:text-[#e8eaed] focus:outline-none focus:border-[#1a73e8]" />
          </div>
          <div>
            <label class="block font-medium mb-1 text-[#202124] dark:text-[#e8eaed]">Lokasi</label>
            <input type="text" id="inputLokasi" class="w-full px-3 py-2 bg-[#f8f9fa] dark:bg-[#121212] border border-[#dadce0] dark:border-[#3c4043] rounded text-[#202124] dark:text-[#e8eaed] focus:outline-none focus:border-[#1a73e8]" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div class="relative">
            <label class="block font-medium mb-1 text-[#202124] dark:text-[#e8eaed]">PIC</label>
            <input 
              type="text" 
              id="inputPic" 
              oninput="handlePicSuggest()" 
              autocomplete="off"
              class="w-full px-3 py-2 bg-[#f8f9fa] dark:bg-[#121212] border border-[#dadce0] dark:border-[#3c4043] rounded text-[#202124] dark:text-[#e8eaed] focus:outline-none focus:border-[#1a73e8]" 
            />
            <div id="picSuggestList" class="hidden absolute left-0 right-0 top-full mt-1 bg-white dark:bg-[#1e1e1e] border border-[#dadce0] dark:border-[#3c4043] rounded shadow-lg max-h-36 overflow-y-auto z-10"></div>
          </div>
          <div>
            <label class="block font-medium mb-1 text-[#202124] dark:text-[#e8eaed]">Kondisi</label>
            <input type="text" id="inputKondisi" class="w-full px-3 py-2 bg-[#f8f9fa] dark:bg-[#121212] border border-[#dadce0] dark:border-[#3c4043] rounded text-[#202124] dark:text-[#e8eaed] focus:outline-none focus:border-[#1a73e8]" />
          </div>
        </div>

        <div>
          <label class="block font-medium mb-1 text-[#202124] dark:text-[#e8eaed]">URL Foto (Link)</label>
          <input type="url" id="inputLink" placeholder="https://..." class="w-full px-3 py-2 bg-[#f8f9fa] dark:bg-[#121212] border border-[#dadce0] dark:border-[#3c4043] rounded text-[#202124] dark:text-[#e8eaed] focus:outline-none focus:border-[#1a73e8]" />
        </div>

        <div>
          <label class="block font-medium mb-1 text-[#202124] dark:text-[#e8eaed]">Catatan (Note)</label>
          <textarea id="inputNote" rows="2" class="w-full px-3 py-2 bg-[#f8f9fa] dark:bg-[#121212] border border-[#dadce0] dark:border-[#3c4043] rounded text-[#202124] dark:text-[#e8eaed] focus:outline-none focus:border-[#1a73e8]"></textarea>
        </div>

        <div class="flex items-center justify-between pt-3 border-t border-[#f1f3f4] dark:border-[#2d2d2d]">
          <button type="button" id="btnDeleteInModal" onclick="deleteDataInModal()" class="px-3 py-1.5 bg-[#fce8e6] dark:bg-[#3c2626] text-[#d93025] dark:text-[#f28b82] font-medium rounded hover:bg-[#fad2cf] transition">
            Hapus
          </button>
          <div class="flex gap-2">
            <button type="button" onclick="closeModal()" class="px-3 py-1.5 bg-[#f1f3f4] dark:bg-[#2d2d2d] text-[#202124] dark:text-[#e8eaed] font-medium rounded hover:bg-[#e8eaed] transition">
              Batal
            </button>
            <button type="submit" class="px-4 py-1.5 bg-[#1a73e8] dark:bg-[#8ab4f8] text-white dark:text-[#202124] font-medium rounded hover:opacity-90 transition">
              Simpan
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL EXPORT CSV -->
  <div id="exportModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
    <div class="bg-white dark:bg-[#1e1e1e] border border-[#dadce0] dark:border-[#3c4043] rounded-xl shadow-2xl w-full max-w-sm overflow-hidden text-xs">
      <div class="flex items-center justify-between p-4 border-b border-[#f1f3f4] dark:border-[#2d2d2d]">
        <h3 class="font-semibold text-sm text-[#202124] dark:text-[#e8eaed]">Export CSV berdasarkan Site</h3>
        <button onclick="closeExportModal()" class="text-[#5f6368] dark:text-[#9aa0a6] hover:text-[#202124] dark:hover:text-[#e8eaed]">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="p-4 space-y-3">
        <div class="flex items-center justify-between border-b border-[#f1f3f4] dark:border-[#2d2d2d] pb-2">
          <label class="flex items-center gap-2 cursor-pointer font-medium text-[#202124] dark:text-[#e8eaed]">
            <input type="checkbox" id="exportSelectAllCb" onchange="toggleSelectAllExportSites(this.checked)" class="rounded border-[#dadce0] text-[#137333] focus:ring-0" />
            <span>Pilih Semua Site</span>
          </label>
          <span id="exportSiteCount" class="text-[#5f6368] dark:text-[#9aa0a6]">Terpilih: 0/0</span>
        </div>

        <div id="exportSitesContainer" class="max-h-48 overflow-y-auto space-y-1">
          <!-- List Site Checkbox -->
        </div>
      </div>

      <div class="flex justify-end gap-2 p-4 bg-[#f8f9fa] dark:bg-[#252525] border-t border-[#f1f3f4] dark:border-[#2d2d2d]">
        <button onclick="closeExportModal()" class="px-3 py-1.5 bg-[#f1f3f4] dark:bg-[#2d2d2d] text-[#202124] dark:text-[#e8eaed] font-medium rounded hover:bg-[#e8eaed] transition">
          Batal
        </button>
        <button onclick="processExportCSV()" class="px-4 py-1.5 bg-[#137333] dark:bg-[#81c995] text-white dark:text-[#202124] font-medium rounded hover:opacity-90 transition">
          Unduh CSV
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL FOTO / GAMBAR ASET -->
  <div id="photoModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-4" onclick="closePhotoModal()">
    <div class="relative bg-white dark:bg-[#1e1e1e] rounded-xl overflow-hidden shadow-2xl max-w-3xl max-h-[85vh] p-2" onclick="event.stopPropagation()">
      <button onclick="closePhotoModal()" class="absolute top-3 right-3 bg-black/50 text-white rounded-full p-1.5 hover:bg-black/70 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
      <img id="photoModalImg" src="" alt="Foto Asset" class="max-w-full max-h-[80vh] object-contain rounded-lg mx-auto" />
    </div>
  </div>

  <!-- Main Application Script -->
  <script src="app.js"></script>
</body>
</html>
