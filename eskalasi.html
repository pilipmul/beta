    <!-- Auth Guard LocalStorage Fleksibel -->
    <script>
        (function checkAuth() {
            const userSessionString = localStorage.getItem("user");
            
            if (!userSessionString) {
                window.location.replace("login.html");
                return;
            }

            try {
                const rawUser = JSON.parse(userSessionString);
                const userData = rawUser.data || rawUser;
                
                if (!userData) {
                    window.location.replace("login.html");
                    return;
                }

                const username = (userData.nama || userData.username || "").toString().trim().toLowerCase();
                if (username === "dede hidayat") {
                    return;
                }

                function checkVal(val) {
                    if (!val) return false;
                    const str = String(val).trim().toUpperCase();
                    return str === "Y" || str === "TRUE" || str === "1";
                }

                const hasAccess = checkVal(userData.eskalasi) || 
                                  checkVal(userData.ESKALASI) || 
                                  (userData.akses && (checkVal(userData.akses.ESKALASI) || checkVal(userData.akses.eskalasi)));

                if (!hasAccess) {
                    window.location.replace("dashboard.html");
                }

            } catch (err) {
                window.location.replace("login.html");
            }
        })();
    </script>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 border-t border-[#f1f3f4] dark:border-[#3c4043] pt-4 items-end">
                    <div>
                        <label class="block font-semibold uppercase tracking-wider text-[#5f6368] dark:text-[#9aa0a6] mb-1.5">Total Nilai Keseluruhan</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-emerald-600 dark:text-emerald-400 font-bold text-xs pointer-events-none">Rp</span>
                            <input type="text" id="nilai" readonly class="w-full bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-800/50 text-emerald-700 dark:text-emerald-400 font-bold rounded-xl pl-10 pr-4 py-2.5 focus:outline-none shadow-xs">
                        </div>
                    </div>
                    <div class="md:col-span-2 flex gap-3">
                        <button type="button" onclick="closeModalEskalasi()" class="w-1/3 bg-[#f1f3f4] dark:bg-[#2d2d2d] hover:bg-[#e8eaed] dark:hover:bg-[#3c4043] text-[#5f6368] dark:text-[#bdc1c6] font-semibold text-xs py-3 px-4 rounded-xl transition cursor-pointer">
                            Batal
                        </button>
                        <button type="submit" id="btnSubmit" disabled class="w-2/3 bg-[#1a73e8] dark:bg-[#8ab4f8] hover:bg-[#1557b0] dark:hover:bg-[#a6c8ff] text-white dark:text-[#202124] font-semibold text-xs py-3 px-4 rounded-xl shadow-lg transition cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                            Submit & Download PDF
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPT TEMPLATE HEADER TERPUSAT -->
    <script src="header-template.js"></script>

    <!-- LOGIKA INTEGRASI TABLEFILTERMANAGER & SUPABASE -->
    <script>
        let tableFilter;
        let rawDataFallback = [];
        let currentSort = { column: 'no', ascending: false };

        function toggleHamburgerMenu(e) {
            if (e) e.stopPropagation();
            const dropdown = document.getElementById('customDropdownMenu');
            const container = document.getElementById('custom-hamburger-content');
            if (!dropdown) return;

            if (container && (!container.innerHTML || container.innerHTML.trim() === '')) {
                renderHamburgerMenuContent();
            }
            dropdown.classList.toggle('hidden');
        }

        function renderHamburgerMenuContent() {
            const container = document.getElementById('custom-hamburger-content');
            if (!container) return;

            container.innerHTML = `
                <button onclick="openModalEskalasi(); toggleHamburgerMenu();" class="w-full text-left px-3 py-2 text-[#202124] dark:text-[#e8eaed] hover:bg-[#f1f3f4] dark:hover:bg-[#2d2d2d] flex items-center gap-2.5 transition cursor-pointer">
                    <svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    <span>Eskalasi Baru</span>
                </button>
            `;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function triggerGlobalSearch() {
            const input = document.getElementById('globalSearchInput');
            const query = input ? input.value.trim() : '';
            const btnClear = document.getElementById('btnClearSearch');

            if (btnClear) {
                if (query !== '') btnClear.classList.remove('hidden');
                else btnClear.classList.add('hidden');
            }

            tableFilter.globalSearchQuery = query;
            loadData();
        }

        function clearGlobalSearch() {
            const input = document.getElementById('globalSearchInput');
            if (input) input.value = '';
            triggerGlobalSearch();
        }

        function updateConnectionStatus(isConnected) {
            const container = document.getElementById("dbStatusIndicator");
            if (container) {
                if (isConnected) {
                    container.innerText = "Status: Connected to Supabase";
                    container.className = "text-emerald-600 dark:text-emerald-400 font-medium";
                } else {
                    container.innerText = "Status: Disconnected";
                    container.className = "text-rose-600 dark:text-rose-400 font-medium";
                }
            }
        }

        // UPDATE STATUS TAMPILAN IKON FILTER BIRU
        function updateFilterUI() {
            if (!tableFilter) return;
            document.querySelectorAll('.filter-icon-btn').forEach(btn => {
                const colKey = btn.getAttribute('data-col');
                const th = btn.closest('th');
                if (!th) return;

                if (colKey && tableFilter.filterSelections[colKey] && tableFilter.filterSelections[colKey].size > 0) {
                    th.classList.add('filter-active');
                } else {
                    th.classList.remove('filter-active');
                }
            });
        }

        function execSort(dir) {
            if (!tableFilter || !tableFilter.activeFilterColumn) return;
            currentSort = {
                column: tableFilter.activeFilterColumn,
                ascending: dir === 'asc'
            };
            tableFilter.closePopover();
            loadData();
        }

        async function loadData() {
            try {
                document.getElementById("loading").style.display = "block";
                document.getElementById("eskalasiTable").classList.add("hidden");

                let query = supabaseClient
                    .from('eskalasi')
                    .select('no, kode, subject, bulan, nilai');

                if (currentSort.column) {
                    query = query.order(currentSort.column, { ascending: currentSort.ascending });
                } else {
                    query = query.order('no', { ascending: false });
                }

                query = tableFilter.applyToSupabaseQuery(query, ['kode', 'subject', 'bulan']);

                const { data, error } = await query;
                if (error) throw error;
                updateConnectionStatus(true);

                rawDataFallback = data || [];

                const formattedData = rawDataFallback.map(item => [
                    String(item.no ?? ''),
                    String(item.kode ?? ''),
                    String(item.subject ?? ''),
                    String(item.bulan ?? '-'),
                    item.nilai ? 'Rp ' + Number(item.nilai).toLocaleString('id-ID') : '-'
                ]);

                document.getElementById("loading").style.display = "none";
                document.getElementById("eskalasiTable").classList.remove("hidden");
                renderTable(formattedData);
                updateFilterUI();
            } catch (e) {
                console.error(e);
                updateConnectionStatus(false);
                document.getElementById("loading").innerHTML = "<p class='text-red-500 font-medium text-xs'>Gagal memproses data Supabase.</p>";
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById("tableBody");
            tbody.innerHTML = "";
            
            const counterEl = document.getElementById("totalDataCount");
            if (counterEl) counterEl.innerText = data.length;

            data.forEach((row, index) => {
                const subjectText = escapeHtml(row[2]);
                const kodeText = escapeHtml(row[1]);

                tbody.innerHTML += `
                    <tr class="hover:bg-[#f8f9fa] dark:hover:bg-[#252525] border-b border-[#f1f3f4] dark:border-[#2d2d2d] text-[#202124] dark:text-[#e8eaed] transition-colors">
                        <td class="p-2.5 text-center whitespace-nowrap text-[#5f6368] dark:text-[#9aa0a6] font-medium">${index + 1}</td>
                        <td class="p-2.5 font-semibold text-[#1a73e8] dark:text-[#8ab4f8] whitespace-nowrap">
                            <button type="button" onclick="loadAndEditEskalasi('${kodeText}')" class="hover:underline cursor-pointer focus:outline-none text-left">
                                ${kodeText}
                            </button>
                        </td>
                        <td class="p-2.5 text-[#202124] dark:text-[#e8eaed] truncate" title="${subjectText}">${subjectText}</td>
                        <td class="p-2.5 text-[#5f6368] dark:text-[#bdc1c6] whitespace-nowrap">${escapeHtml(row[3])}</td>
                        <td class="p-2.5 text-[#202124] dark:text-[#e8eaed] font-semibold whitespace-nowrap">${escapeHtml(row[4])}</td>
                    </tr>
                `;
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof renderHeader === 'function') {
                renderHeader({
                    subtitle: "Eskalasi Budget",
                    hamburgerItems: [
                        {
                            label: "Eskalasi Baru",
                            icon: `<svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>`,
                            onClick: "openModalEskalasi()"
                        }
                    ]
                });
            }
            renderHamburgerMenuContent();

            tableFilter = new TableFilterManager({
                tableName: 'eskalasi',
                supabaseClient: supabaseClient,
                columns: ['kode', 'subject', 'bulan', 'nilai'],
                numericColumns: ['no', 'nilai'],
                dateColumns: [],
                popoverId: 'filterPopover',
                containerId: 'filterItemsList',
                searchInputId: 'filterSearchInput',
                selectAllId: 'selectAllCheckbox',
                onFilterChange: () => {
                    loadData();
                }
            });

            loadData();
        });

        // AUTO CLOSE HANDLER
        document.addEventListener('click', (e) => {
            const popover = document.getElementById('filterPopover');
            if (popover && !popover.contains(e.target) && !e.target.closest('.filter-icon-btn')) {
                tableFilter.closePopover();
            }
            const dropdown = document.getElementById('customDropdownMenu');
            const btn = document.getElementById('hamburgerBtn');
            if (dropdown && !dropdown.classList.contains('hidden')) {
                if (!dropdown.contains(e.target) && !btn?.contains(e.target)) {
                    dropdown.classList.add('hidden');
                }
            }
        });

        window.addEventListener('scroll', (e) => {
            const popover = document.getElementById('filterPopover');
            if (popover && !popover.contains(e.target) && tableFilter) {
                tableFilter.closePopover();
            }
        }, true);
    </script>

    <!-- MODULE ESKALASI SCRIPT -->
    <script src="eskin.js"></script>
</body>
