<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Work Meeting - SOT</title>

  <!-- PROTEKSI LOGIN INSTAN SEBELUM ELEMEN TAMPILAN DIDERENDER -->
  <script>
    (function checkAuth() {
      const userSessionString = localStorage.getItem("user");
      
      if (!userSessionString) {
        window.location.replace("login.html");
        return;
      }

      try {
        const userData = JSON.parse(userSessionString);
        if (!userData || !userData.akses || userData.akses.RKM !== "Y") {
          window.location.replace("https://sotpbc.vercel.app/dashboard.html");
        }
      } catch (err) {
        window.location.replace("login.html");
      }
    })();
  </script>

  <!-- IMPORT GLOBAL NAVIGATION ISOLATION STYLES -->
  <link rel="stylesheet" href="global-header.css">

  <!-- Tailwind CSS v4 Browser Build -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }

    /* MENGHILANGKAN SCROLLBAR HASIL PERTUKARAN MODUL */
    html, body {
      scrollbar-width: none;
      -ms-overflow-style: none;
      overflow-x: hidden;
    }
    html::-webkit-scrollbar, body::-webkit-scrollbar {
      display: none;
    }

    /* CUSTOM TAG INPUT STYLE UNTUK PIC */
    .pic-tag-container {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 6px;
      background-color: #fff;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      min-height: 42px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .pic-tag-container:focus-within {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
    }
    .pic-tag {
      background-color: #eff6ff;
      color: #1d4ed8;
      padding: 2px 10px;
      border-radius: 16px;
      font-size: 0.85rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #bfdbfe;
    }
    .pic-tag .btn-remove {
      cursor: pointer;
      font-weight: bold;
      line-height: 1;
      opacity: 0.7;
    }
    .pic-tag .btn-remove:hover {
      opacity: 1;
      color: #dc2626;
    }
    .pic-input-search {
      border: none;
      outline: none;
      flex-grow: 1;
      min-width: 120px;
      padding: 2px 4px;
      font-size: 0.9rem;
    }

    /* Style Baris Tabel berdasarkan Status */
    tr.row-done { background-color: #f0fdf4 !important; color: #15803d !important; }
    tr.row-close { background-color: #f8fafc !important; color: #64748b !important; }
  </style>

  <!-- SUPABASE JS SDK VIA CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

<!-- GLOBAL NAVIGATION SHELL (PRESISI STABIL TIDAK BERGERAK SAAT PINDAH HALAMAN) -->
<div id="global-header">
    <header class="bg-slate-900 text-white shadow-md sticky top-0">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center gap-4 w-full box-border">
            
            <!-- SISI KIRI: Global Nav Dropdown Avatar & Title -->
            <div class="flex items-center gap-3">
                <div class="relative inline-block" id="navDropdownWrapper">
                    <button type="button" onclick="toggleNavDropdown(event)" class="rounded-full bg-blue-600 hover:bg-blue-700 text-white flex items-center justify-center font-bold ring-2 ring-blue-400/50 cursor-pointer shadow-md transition-all active:scale-95" title="Menu Navigasi">
                        <span id="nav-header-avatar">U</span>
                    </button>
                    <!-- Container Dropdown Menu Navigasi Global -->
                    <div id="navDropdownMenu" class="hidden absolute left-0 mt-2 w-56 bg-slate-900 border border-slate-700 text-slate-300 rounded-xl shadow-2xl overflow-hidden py-2 text-xs"></div>
                </div>

                <div>
                    <h1>Sistem Operasional Terintegrasi</h1>
                    <p id="header-subtitle-text">Sistem Terintegrasi</p>
                </div>
            </div>

            <!-- SISI KANAN: Hamburger Control Modul -->
            <div class="relative inline-block">
                <button type="button" id="hamburgerBtn" onclick="toggleConnDropdown(event)" class="p-2.5 rounded-lg border transition-all flex items-center justify-center bg-emerald-500/10 text-emerald-400 border-emerald-500/30 hover:bg-emerald-500/20 cursor-pointer">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
                <div id="connDropdown" class="hidden absolute right-0 mt-2 w-52 bg-white rounded-lg shadow-xl border border-slate-200 overflow-hidden py-1">
                    <div id="custom-hamburger-content"></div>
                </div>
            </div>

        </div>
    </header>
</div>

<!-- Main Content Area -->
<main class="max-w-7xl mx-auto px-4 py-8">
  <div class="bg-white rounded-xl shadow-xs border border-slate-200 overflow-hidden p-6">

    <!-- TABEL RINGKAS 7 KOLOM TAILWIND -->
    <div class="overflow-x-auto rounded-lg border border-slate-200 max-h-[70vh]">
      <table class="min-w-full divide-y divide-slate-200 text-left text-sm">
        <thead class="bg-slate-900 text-white uppercase text-xs tracking-wider sticky top-0 z-10">
          <tr>
            <th scope="col" class="px-4 py-3 font-semibold text-center whitespace-nowrap">
              <div class="inline-flex items-center justify-center gap-1.5">
                <span>Tanggal</span>
                <button class="p-1 hover:bg-slate-800 rounded transition cursor-pointer text-slate-400 hover:text-white" onclick="toggleFilterMenu(event, 'Tanggal')">▼</button>
              </div>
            </th>
            <th scope="col" class="px-4 py-3 font-semibold text-center whitespace-nowrap">
              <div class="inline-flex items-center justify-center gap-1.5">
                <span>Sumber</span>
                <button class="p-1 hover:bg-slate-800 rounded transition cursor-pointer text-slate-400 hover:text-white" onclick="toggleFilterMenu(event, 'Sumber')">▼</button>
              </div>
            </th>
            <th scope="col" class="px-4 py-3 font-semibold text-center whitespace-nowrap">
              <div class="inline-flex items-center justify-center gap-1.5">
                <span>Case</span>
                <button class="p-1 hover:bg-slate-800 rounded transition cursor-pointer text-slate-400 hover:text-white" onclick="toggleFilterMenu(event, 'Case')">▼</button>
              </div>
            </th>
            <th scope="col" class="px-4 py-3 font-semibold text-center whitespace-nowrap">
              <div class="inline-flex items-center justify-center gap-1.5">
                <span>PIC</span>
                <button class="p-1 hover:bg-slate-800 rounded transition cursor-pointer text-slate-400 hover:text-white" onclick="toggleFilterMenu(event, 'PIC')">▼</button>
              </div>
            </th>
            <th scope="col" class="px-4 py-3 font-semibold text-center whitespace-nowrap">
              <div class="inline-flex items-center justify-center gap-1.5">
                <span>Update</span>
                <button class="p-1 hover:bg-slate-800 rounded transition cursor-pointer text-slate-400 hover:text-white" onclick="toggleFilterMenu(event, 'Update')">▼</button>
              </div>
            </th>
            <th scope="col" class="px-4 py-3 font-semibold text-center whitespace-nowrap">
              <div class="inline-flex items-center justify-center gap-1.5">
                <span>Target</span>
                <button class="p-1 hover:bg-slate-800 rounded transition cursor-pointer text-slate-400 hover:text-white" onclick="toggleFilterMenu(event, 'Target')">▼</button>
              </div>
            </th>
            <th scope="col" class="px-4 py-3 font-semibold text-center whitespace-nowrap">
              <div class="inline-flex items-center justify-center gap-1.5">
                <span>Status</span>
                <button class="p-1 hover:bg-slate-800 rounded transition cursor-pointer text-slate-400 hover:text-white" onclick="toggleFilterMenu(event, 'Status')">▼</button>
              </div>
            </th>
          </tr>
        </thead>
        <tbody id="rkmTableBody" class="divide-y divide-slate-200 bg-white">
          <tr>
            <td colspan="7" class="text-center text-slate-400 py-8">Loading RKM data...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<!-- DROPDOWN MENU TAILWIND FOR SORT & FILTER -->
<div id="filterDropdown" class="hidden absolute z-50 bg-white rounded-xl shadow-2xl border border-slate-200 p-4 w-60 text-xs">
  <div class="flex flex-col gap-2">
    <div class="font-bold text-slate-700 border-b border-slate-200 pb-2" id="filterHeaderTitle">Filter Column</div>

    <!-- CONTAINER SORTING A-Z -->
    <div id="sortContainer" class="flex flex-col gap-1">
      <button class="w-full text-left px-3 py-1.5 bg-slate-50 hover:bg-blue-50 text-slate-700 hover:text-blue-600 rounded-md border border-slate-200 font-medium transition cursor-pointer" onclick="applySort('asc')">
        ▲ Sort A-Z
      </button>
      <button class="w-full text-left px-3 py-1.5 bg-slate-50 hover:bg-blue-50 text-slate-700 hover:text-blue-600 rounded-md border border-slate-200 font-medium transition cursor-pointer" onclick="applySort('desc')">
        ▼ Sort Z-A
      </button>
      <div class="my-1 border-t border-slate-200"></div>
    </div>

    <!-- AREA FILTER INPUT TIPE TEKS -->
    <div id="textFilterContainer">
      <label class="block mb-1 text-[11px] font-semibold text-slate-600">Filter Search:</label>
      <input type="text" id="filterSearchInput" class="w-full px-2.5 py-1.5 border border-slate-300 rounded-md text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Type to filter..." oninput="applyTextFilter()">
    </div>

    <!-- AREA FILTER MULTIPLE CHOICE CHECKBOX -->
    <div id="statusFilterContainer" class="hidden">
      <label class="block mb-1 text-[11px] font-semibold text-slate-600">Pilih Status (Multi):</label>
      <div class="flex flex-col gap-1.5">
        <label class="inline-flex items-center gap-2 cursor-pointer">
          <input class="chk-status-filter rounded text-blue-600" type="checkbox" value="Open" id="chkStatusOpen" onchange="applyStatusFilter()">
          <span class="font-semibold text-slate-700">Open</span>
        </label>
        <label class="inline-flex items-center gap-2 cursor-pointer">
          <input class="chk-status-filter rounded text-blue-600" type="checkbox" value="Done" id="chkStatusDone" onchange="applyStatusFilter()">
          <span class="font-semibold text-emerald-600">Done</span>
        </label>
        <label class="inline-flex items-center gap-2 cursor-pointer">
          <input class="chk-status-filter rounded text-blue-600" type="checkbox" value="Close" id="chkStatusClose" onchange="applyStatusFilter()">
          <span class="font-semibold text-slate-500">Close</span>
        </label>
      </div>
    </div>

    <button class="text-red-500 hover:text-red-700 font-medium text-right text-[11px] mt-1 cursor-pointer" onclick="clearColumnFilter()">Clear Filter</button>
  </div>
</div>

<!-- MODAL TAILWIND FORM EDIT / ADD -->
<div id="rkmModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
  <div class="bg-white max-w-2xl w-full rounded-2xl shadow-2xl overflow-hidden border border-slate-200">
    <div class="bg-slate-900 px-6 py-4 text-white flex justify-between items-center">
      <h3 id="modalTitle" class="font-bold text-base">Add New Agenda</h3>
      <button onclick="closeModalForm()" class="text-slate-400 hover:text-white text-xl font-bold cursor-pointer">&times;</button>
    </div>
    
    <form id="rkmForm" class="p-6 space-y-4">
      <input type="hidden" id="inpId">
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Tanggal</label>
          <input type="date" id="inpTanggal" class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
        </div>
        <div class="md:col-span-2">
          <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Sumber</label>
          <input type="text" id="inpSumber" class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Case (Rencana & Kendala)</label>
        <textarea id="inpCase" rows="3" class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" required></textarea>
      </div>
      
      <!-- ISIAN PIC INTERAKTIF -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">PIC</label>
          <div class="pic-tag-container" id="picTagContainer" onclick="focusPicInput()">
            <input type="text" id="inpPicSearch" class="pic-input-search" placeholder="Ketik PIC..." list="picDatalist" oninput="handlePicSelect(this)">
          </div>
          <p class="text-[10px] text-slate-400 mt-1">Ketik nama PIC untuk memilih dari daftar opsi.</p>

          <datalist id="picDatalist">
            <option value="GA"></option>
            <option value="Head Ops."></option>
            <option value="ME"></option>
            <option value="TRO"></option>
            <option value="FA"></option>
            <option value="Head FA"></option>
            <option value="Security"></option>
            <option value="All"></option>
            <option value="CS"></option>
            <option value="Kasir"></option>
            <option value="MKT"></option>
          </datalist>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Target Selesai</label>
          <input type="text" id="inpTarget" class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Contoh: W3 Juli 2026">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Update Progress & Realisasi</label>
        <textarea id="inpUpdate" rows="3" class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Status Case</label>
        <select id="inpStatus" class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 font-bold focus:ring-2 focus:ring-blue-500 focus:outline-none">
          <option value="Open">Open (In Progress)</option>
          <option value="Done" class="bg-green-100 text-green-800">Done (Completed)</option>
          <option value="Close" class="bg-slate-100 text-slate-800">Close (Closed)</option>
        </select>
      </div>

      <div class="pt-4 flex justify-between items-center border-t border-slate-100">
        <button type="button" id="btnDeleteModal" class="hidden px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-xs font-semibold transition cursor-pointer" onclick="deleteFromModal()">
          Delete Agenda
        </button>
        <div class="flex gap-3 ml-auto">
          <button type="button" onclick="closeModalForm()" class="px-4 py-2 border border-slate-300 rounded-lg text-xs font-semibold text-slate-600 hover:bg-slate-50 transition cursor-pointer">Batal</button>
          <button type="button" onclick="submitForm()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-semibold transition cursor-pointer">Simpan Data</button>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- IMPORT SCRIPT TEMPLATE HEADER TERPUSAT -->
<script src="header-template.js"></script>

<script>
  // 1. KREDENSIAL SUPABASE
  const SUPABASE_URL = "https://sfblelnbczlvykqemhtm.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_9k7sUNqlqhRqjkUtSNpFPQ_VAspSZT0";
  const { createClient } = supabase;
  const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const TABLE_NAME = "rkm";
  
  const VALID_PICS = ["GA", "Head Ops.", "ME", "TRO", "FA", "Head FA", "Security", "All", "CS", "Kasir", "MKT"];
  let selectedPicsArray = [];

  let usernameFromStorage = "Tamu";
  try {
    const userData = JSON.parse(localStorage.getItem("user"));
    if (userData && userData.nama) {
      usernameFromStorage = userData.nama;
    }
  } catch (err) {
    console.error("Gagal membaca session:", err);
  }

  const CURRENT_USER = usernameFromStorage;
  const ALLOWED_EDITORS = ["Dede Hidayat", "Sutriono", "Herliana Oktavianti"];
  const isEditor = ALLOWED_EDITORS.includes(CURRENT_USER);

  let rkmDataCache = [];
  let rkmDataFiltered = [];

  let activeColumn = "";
  let filtersState = {
    Tanggal: "", Sumber: "", Case: "", PIC: "", Update: "", Target: "", Status: ["open", "done", "close"]
  };
  let sortState = { col: null, dir: null };

  // 2. INISIALISASI HEADER INSTAN
  const hamburgerMenuOptions = [];
  if (isEditor) {
    hamburgerMenuOptions.push({
      label: "+ New Agenda",
      icon: `<svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>`,
      onClick: "openModal()"
    });
  }

  renderHeader({
    subtitle: "Rapat Kerja Mingguan (RKM)",
    hamburgerItems: hamburgerMenuOptions
  });

  document.addEventListener("DOMContentLoaded", () => {
    fetchRKMData();

    document.addEventListener("click", (e) => {
      const dropdown = document.getElementById("filterDropdown");
      if (!dropdown.contains(e.target) && !e.target.closest('button[onclick*="toggleFilterMenu"]')) {
        dropdown.classList.add("hidden");
      }
    });
  });

  /* MULTI-TAG INPUT PIC */
  function focusPicInput() {
    document.getElementById("inpPicSearch").focus();
  }

  function handlePicSelect(input) {
    const val = input.value.trim();
    const match = VALID_PICS.find(p => p.toLowerCase() === val.toLowerCase());

    if (match) {
      if (!selectedPicsArray.includes(match)) {
        selectedPicsArray.push(match);
        renderPicTags();
      }
      input.value = "";
    }
  }

  function removePic(picName) {
    selectedPicsArray = selectedPicsArray.filter(p => p !== picName);
    renderPicTags();
  }

  function renderPicTags() {
    const container = document.getElementById("picTagContainer");
    const inputSearch = document.getElementById("inpPicSearch");

    container.querySelectorAll(".pic-tag").forEach(el => el.remove());

    selectedPicsArray.forEach(pic => {
      const tag = document.createElement("span");
      tag.className = "pic-tag";
      tag.innerHTML = `${pic} <span class="btn-remove" onclick="removePic('${pic}')">&times;</span>`;
      container.insertBefore(tag, inputSearch);
    });
  }

  /* SUPABASE FETCH DATA */
  async function fetchRKMData() {
    const tbody = document.getElementById("rkmTableBody");
    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-slate-400 py-8">Loading RKM data...</td></tr>';

    const { data, error } = await _supabase
      .from(TABLE_NAME)
      .select('*')
      .order('Tanggal', { ascending: false });

    if (error) {
      console.error("Detail Error:", error);
      tbody.innerHTML = `<tr><td colspan="7" class="text-center text-red-500 py-8">Gagal memuat data: ${error.message}</td></tr>`;
      return;
    }

    rkmDataCache = data || [];
    processDataAndRender();
  }

  /* POPUP FILTER MENU */
  function toggleFilterMenu(e, columnKey) {
    e.stopPropagation();
    activeColumn = columnKey;
    const dropdown = document.getElementById("filterDropdown");
    
    document.getElementById("filterHeaderTitle").innerText = `Filter: ${columnKey.toUpperCase()}`;

    const sortContainer = document.getElementById("sortContainer");
    const textContainer = document.getElementById("textFilterContainer");
    const statusContainer = document.getElementById("statusFilterContainer");

    if (columnKey === 'Status') {
      sortContainer.classList.add("hidden");
      textContainer.classList.add("hidden");
      statusContainer.classList.remove("hidden");

      document.querySelectorAll(".chk-status-filter").forEach(chk => {
        chk.checked = filtersState.Status.includes(chk.value.toLowerCase());
      });
    } else {
      sortContainer.classList.remove("hidden");
      textContainer.classList.remove("hidden");
      statusContainer.classList.add("hidden");
      document.getElementById("filterSearchInput").value = filtersState[columnKey] || "";
    }

    dropdown.classList.remove("hidden");

    const rect = e.target.getBoundingClientRect();
    const dropdownWidth = dropdown.offsetWidth || 240;
    const windowWidth = window.innerWidth;

    let leftPos = rect.left - 180;
    if (leftPos < 10) leftPos = Math.max(10, rect.left);
    if (leftPos + dropdownWidth > windowWidth - 10) leftPos = windowWidth - dropdownWidth - 10;

    dropdown.style.left = `${leftPos}px`;
    dropdown.style.top = `${rect.bottom + window.scrollY + 5}px`;
    
    if (columnKey !== 'Status') {
      setTimeout(() => document.getElementById("filterSearchInput").focus(), 100);
    }
  }

  function applySort(direction) {
    sortState = { col: activeColumn, dir: direction };
    processDataAndRender();
    document.getElementById("filterDropdown").classList.add("hidden");
  }

  function applyTextFilter() {
    const val = document.getElementById("filterSearchInput").value;
    filtersState[activeColumn] = val.toLowerCase();
    processDataAndRender();
  }

  function applyStatusFilter() {
    const checkedValues = [];
    document.querySelectorAll(".chk-status-filter:checked").forEach(chk => {
      checkedValues.push(chk.value.toLowerCase());
    });
    filtersState.Status = checkedValues;
    processDataAndRender();
  }

  function clearColumnFilter() {
    if (activeColumn === 'Status') {
      filtersState.Status = ["open", "done", "close"];
      document.querySelectorAll(".chk-status-filter").forEach(chk => chk.checked = true);
    } else {
      filtersState[activeColumn] = "";
      document.getElementById("filterSearchInput").value = "";
    }
    if (sortState.col === activeColumn) sortState = { col: null, dir: null };
    processDataAndRender();
    document.getElementById("filterDropdown").classList.add("hidden");
  }

  function processDataAndRender() {
    let result = [...rkmDataCache];

    Object.keys(filtersState).forEach(key => {
      const query = filtersState[key];
      
      if (key === 'Status') {
        if (Array.isArray(query)) {
          if (query.length === 0) {
            result = [];
          } else {
            result = result.filter(item => {
              const val = (item.Status || item.status || "Open").toString().toLowerCase();
              return query.includes(val);
            });
          }
        }
      } else if (query) {
        result = result.filter(item => {
          const val = (item[key] || item[key.toLowerCase()] || "").toString().toLowerCase();
          return val.includes(query);
        });
      }
    });

    if (sortState.col && sortState.dir) {
      const key = sortState.col;
      const isAsc = sortState.dir === 'asc';
      result.sort((a, b) => {
        const valA = (a[key] || a[key.toLowerCase()] || "").toString().toLowerCase();
        const valB = (b[key] || b[key.toLowerCase()] || "").toString().toLowerCase();
        return isAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
      });
    }

    rkmDataFiltered = result;
    renderTable(rkmDataFiltered);
  }

  function renderTable(data) {
    const tbody = document.getElementById("rkmTableBody");
    tbody.innerHTML = "";

    if (data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" class="text-center text-slate-400 py-6">Tidak ada agenda kerja yang sesuai.</td></tr>`;
      return;
    }

    data.forEach((item) => {
      const originalIndex = rkmDataCache.findIndex(d => d.id === item.id);
      const tr = document.createElement("tr");
      tr.setAttribute("data-id", item.id);
      tr.className = "hover:bg-slate-50 transition border-b border-slate-200";

      const status = item.Status || item.status || "Open";
      const tanggal = item.Tanggal || item.tanggal || "-";
      const sumber = item.Sumber || item.sumber || "-";
      const caseText = item.Case || item.case || "-";
      const picText = item.PIC || item.pic || "";
      const updateText = item.Update || item.update || "-";
      const targetText = item.Target || item.target || "-";

      if (status === "Done") {
        tr.classList.add("row-done");
      } else if (status === "Close") {
        tr.classList.add("row-close");
      }

      let statusBadgeClass = "bg-blue-50 text-blue-700 border-blue-200";
      if (status === "Done") statusBadgeClass = "bg-emerald-100 text-emerald-800 border-emerald-300";
      if (status === "Close") statusBadgeClass = "bg-slate-200 text-slate-700 border-slate-300";

      const picBadges = picText 
        ? picText.split(",").map(p => `<span class="inline-block bg-slate-100 text-slate-700 border border-slate-200 rounded-full px-2.5 py-0.5 text-[11px] font-medium mr-1 mb-1">${p.trim()}</span>`).join("")
        : '-';

      const clickAttr = isEditor ? `onclick="openModal(${originalIndex})"` : '';
      const cursorClass = isEditor ? 'cursor-pointer hover:scale-105 transition' : 'cursor-default';
      const titleAttr = isEditor ? 'Click to edit' : 'Read only';

      tr.innerHTML = `
        <td class="px-4 py-3 whitespace-nowrap font-medium text-slate-900">${tanggal}</td>
        <td class="px-4 py-3 text-slate-600">${sumber}</td>
        <td class="px-4 py-3 text-slate-800">${caseText}</td>
        <td class="px-4 py-3">${picBadges}</td>
        <td class="px-4 py-3 text-slate-600">${updateText}</td>
        <td class="px-4 py-3 text-slate-600 whitespace-nowrap">${targetText}</td>
        <td class="px-4 py-3 text-center whitespace-nowrap">
          <span class="inline-block rounded-full border px-3 py-1 text-xs font-semibold shadow-xs ${statusBadgeClass} ${cursorClass}" ${clickAttr} title="${titleAttr}">
            ${status}
          </span>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function updateRowInDom(updatedItem) {
    const index = rkmDataCache.findIndex(d => d.id == updatedItem.id);
    if (index !== -1) {
      rkmDataCache[index] = updatedItem;
    }

    const tr = document.querySelector(`tr[data-id="${updatedItem.id}"]`);
    if (!tr) return;

    const status = updatedItem.Status || updatedItem.status || "Open";
    const tanggal = updatedItem.Tanggal || updatedItem.tanggal || "-";
    const sumber = updatedItem.Sumber || updatedItem.sumber || "-";
    const caseText = updatedItem.Case || updatedItem.case || "-";
    const picText = updatedItem.PIC || updatedItem.pic || "";
    const updateText = updatedItem.Update || updatedItem.update || "-";
    const targetText = updatedItem.Target || updatedItem.target || "-";

    tr.className = "hover:bg-slate-50 transition border-b border-slate-200";
    if (status === "Done") tr.classList.add("row-done");
    else if (status === "Close") tr.classList.add("row-close");

    let statusBadgeClass = "bg-blue-50 text-blue-700 border-blue-200";
    if (status === "Done") statusBadgeClass = "bg-emerald-100 text-emerald-800 border-emerald-300";
    if (status === "Close") statusBadgeClass = "bg-slate-200 text-slate-700 border-slate-300";

    const picBadges = picText 
      ? picText.split(",").map(p => `<span class="inline-block bg-slate-100 text-slate-700 border border-slate-200 rounded-full px-2.5 py-0.5 text-[11px] font-medium mr-1 mb-1">${p.trim()}</span>`).join("")
      : '-';

    const clickAttr = isEditor ? `onclick="openModal(${index})"` : '';
    const cursorClass = isEditor ? 'cursor-pointer hover:scale-105 transition' : 'cursor-default';
    const titleAttr = isEditor ? 'Click to edit' : 'Read only';

    tr.innerHTML = `
      <td class="px-4 py-3 whitespace-nowrap font-medium text-slate-900">${tanggal}</td>
      <td class="px-4 py-3 text-slate-600">${sumber}</td>
      <td class="px-4 py-3 text-slate-800">${caseText}</td>
      <td class="px-4 py-3">${picBadges}</td>
      <td class="px-4 py-3 text-slate-600">${updateText}</td>
      <td class="px-4 py-3 text-slate-600 whitespace-nowrap">${targetText}</td>
      <td class="px-4 py-3 text-center whitespace-nowrap">
        <span class="inline-block rounded-full border px-3 py-1 text-xs font-semibold shadow-xs ${statusBadgeClass} ${cursorClass}" ${clickAttr} title="${titleAttr}">
          ${status}
        </span>
      </td>
    `;
  }

  /* CONTROL MODAL TAILWIND FORM */
  function openModal(index = null) {
    if (!isEditor) {
      alert("Akses Terbatas: Anda hanya memiliki hak akses membaca (Read-Only).");
      return;
    }

    const form = document.getElementById("rkmForm");
    form.reset();
    document.getElementById("inpId").value = "";
    document.getElementById("inpStatus").value = "Open";

    selectedPicsArray = [];
    renderPicTags();

    const btnDelete = document.getElementById("btnDeleteModal");

    if (index !== null) {
      document.getElementById("modalTitle").innerText = "Edit Agenda RKM";
      const item = rkmDataCache[index];
      
      document.getElementById("inpId").value = item.id;
      document.getElementById("inpTanggal").value = item.Tanggal || item.tanggal || "";
      document.getElementById("inpSumber").value = item.Sumber || item.sumber || "";
      document.getElementById("inpCase").value = item.Case || item.case || "";
      document.getElementById("inpTarget").value = item.Target || item.target || "";
      document.getElementById("inpUpdate").value = item.Update || item.update || "";
      document.getElementById("inpStatus").value = item.Status || item.status || "Open";

      const picVal = item.PIC || item.pic;
      if (picVal) {
        selectedPicsArray = picVal.split(",").map(p => p.trim()).filter(p => p !== "");
        renderPicTags();
      }

      btnDelete.classList.remove("hidden");
    } else {
      document.getElementById("modalTitle").innerText = "Add New Agenda";
      btnDelete.classList.add("hidden");
    }
    document.getElementById("rkmModal").classList.remove("hidden");
  }

  function closeModalForm() {
    document.getElementById("rkmModal").classList.add("hidden");
  }

  /* SIMPAN KE SUPABASE */
  async function submitForm() {
    if (!isEditor) {
      alert("Akses Ditolak: Anda tidak memiliki izin untuk menyimpan data.");
      return;
    }

    const form = document.getElementById("rkmForm");
    if(!form.checkValidity()) {
      form.reportValidity();
      return;
    }

    if (selectedPicsArray.length === 0) {
      alert("Pilih minimal satu PIC.");
      return;
    }

    const id = document.getElementById("inpId").value;
    
    const payload = {
      Tanggal: document.getElementById("inpTanggal").value,
      Sumber: document.getElementById("inpSumber").value,
      Case: document.getElementById("inpCase").value,
      PIC: selectedPicsArray.join(", "),
      Target: document.getElementById("inpTarget").value,
      Update: document.getElementById("inpUpdate").value,
      Status: document.getElementById("inpStatus").value
    };

    if (id) {
      const { data, error } = await _supabase
        .from(TABLE_NAME)
        .update(payload)
        .eq('id', id)
        .select();

      if (error) {
        alert("Gagal menyimpan ke Supabase: " + error.message);
      } else {
        closeModalForm();
        if (data && data.length > 0) {
          updateRowInDom(data[0]);
        }
      }
    } else {
      const { error } = await _supabase
        .from(TABLE_NAME)
        .insert([payload]);

      if (error) {
        alert("Gagal menyimpan ke Supabase: " + error.message);
      } else {
        closeModalForm();
        fetchRKMData();
      }
    }
  }

  /* HAPUS DATA FROM MODAL */
  async function deleteFromModal() {
    if (!isEditor) {
      alert("Akses Ditolak: Anda tidak memiliki izin untuk menghapus data.");
      return;
    }

    const id = document.getElementById("inpId").value;
    if (!id) return;

    if (!confirm("⚠️ PERINGATAN:\nApakah Anda yakin ingin menghapus agenda kerja ini secara permanen?")) {
      return;
    }

    const { error } = await _supabase
      .from(TABLE_NAME)
      .delete()
      .eq('id', id);

    if (error) {
      alert("Gagal menghapus data: " + error.message);
    } else {
      closeModalForm();
      fetchRKMData();
    }
  }
</script>
</body>
