    // Verifikasi Sesi sebelum halaman dimuat (Wajib Ada untuk membaca hak akses RBAC)
    (function() {
      try {
        const session = localStorage.getItem("user");
        if (!session) { 
          window.location.replace("https://sotpbc.vercel.app/login.html"); 
          return; 
        }
        const userData = JSON.parse(session);
        if (!userData) { 
          window.location.replace("https://sotpbc.vercel.app/login.html"); 
          return; 
        }
        window.currentUser = userData.data || userData;
      } catch (err) {
        window.location.replace("https://sotpbc.vercel.app/login.html");
      }
    })();
  </script>

  <!-- SCRIPT UTAMA ACCESS CONTROL HALAMAN -->
  <script>
    const SUPABASE_URL = "https://sfblelnbczlvykqemhtm.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_9k7sUNqlqhRqjkUtSNpFPQ_VAspSZT0"; 
    
    let supabaseClient = null;
    if (window.supabase) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    let allUsers = [];
    let displayedUsers = [];
    let globalSearchQuery = '';

    let activeFilterColumn = null;
    let filterSelections = {}; 
    let draftFilterSelections = new Set(); 
    let dbFilterOptions = {};
    let sortConfig = { column: null, direction: null };

    document.addEventListener("DOMContentLoaded", () => {
      // Panggil Inisialisasi Sidebar Navigasi setelah DOM & user session siap
      if (typeof renderHeader === 'function') {
        renderHeader({ subtitle: "Access Control" });
      }
      fetchUsers();
    });

    document.addEventListener('click', (e) => {
      const popover = document.getElementById('filterPopover');
      if (popover && !popover.classList.contains('hidden') && !popover.contains(e.target) && !e.target.closest('button[onclick*="toggleFilterMenu"]')) {
        closeFilterPopover();
      }
    });

    function isAccessTrue(val) {
      if (!val) return false;
      const str = String(val).trim().toUpperCase();
      return str === "Y" || str === "TRUE" || str === "1";
    }

    async function fetchUsers() {
      const tbody = document.getElementById("userTableBody");
      tbody.innerHTML = `<tr><td colspan="11" class="text-center py-8 text-[#5f6368] dark:text-[#9aa0a6]">Memuat data pengguna...</td></tr>`;

      if (!supabaseClient) {
        showToast("Error", "Koneksi Supabase tidak tersedia.", "error");
        return;
      }

      try {
        const { data, error } = await supabaseClient
          .from('users')
          .select('*')
          .order('nama', { ascending: true });
        if (error) throw error;

        allUsers = (data || []).filter(u => 
          (u.nama || "").trim().toLowerCase() !== "dede hidayat"
        );

        dbFilterOptions = {};
        processAndRenderUsers();
      } catch (err) {
        console.error("Fetch users error:", err);
        tbody.innerHTML = `<tr><td colspan="11" class="text-center py-8 text-[#d93025] dark:text-[#f28b82]">Gagal memuat data pengguna dari Supabase.</td></tr>`;
        showToast("Gagal Loading", err.message || "Gagal mengambil data dari server.", "error");
      }
    }

    function triggerGlobalSearch() {
      const val = document.getElementById('globalSearchInput').value.trim();
      globalSearchQuery = val;

      const btnClear = document.getElementById('btnClearSearch');
      if (val !== '') {
        btnClear.classList.remove('hidden');
      } else {
        btnClear.classList.add('hidden');
      }

      processAndRenderUsers();
    }

    function clearGlobalSearch() {
      document.getElementById('globalSearchInput').value = '';
      document.getElementById('btnClearSearch').classList.add('hidden');
      globalSearchQuery = '';
      processAndRenderUsers();
    }

    function processAndRenderUsers() {
      let filtered = [...allUsers];

      if (globalSearchQuery) {
        const q = globalSearchQuery.toLowerCase();
        filtered = filtered.filter(u => 
          (u.nama && u.nama.toLowerCase().includes(q))
        );
      }

      for (const colKey in filterSelections) {
        const selectedSet = filterSelections[colKey];
        if (selectedSet && selectedSet.size > 0) {
          filtered = filtered.filter(u => {
            let val = u[colKey];
            if (['eskalasi', 'rkm', 'perbaikan', 'task', 'sync', 'item', 'log', 'assets', 'acces'].includes(colKey)) {
              val = isAccessTrue(val) ? 'Aktif' : 'Tidak';
            } else {
              val = (val !== null && val !== undefined && val !== '') ? String(val) : '-';
            }
            return selectedSet.has(val);
          });
        }
      }

      if (sortConfig.column && sortConfig.direction) {
        const key = sortConfig.column;
        const dir = sortConfig.direction === 'asc' ? 1 : -1;
        filtered.sort((a, b) => {
          let valA = a[key] || '';
          let valB = b[key] || '';

          if (['eskalasi', 'rkm', 'perbaikan', 'task', 'sync', 'item', 'log', 'assets', 'acces'].includes(key)) {
            valA = isAccessTrue(valA) ? 'Aktif' : 'Tidak';
            valB = isAccessTrue(valB) ? 'Aktif' : 'Tidak';
          }

          return String(valA).localeCompare(String(valB), undefined, { numeric: true, sensitivity: 'base' }) * dir;
        });
      }

      displayedUsers = filtered;
      document.getElementById("userCount").textContent = displayedUsers.length;
      renderUsers(displayedUsers);
    }

    function renderUsers(usersList) {
      const tbody = document.getElementById("userTableBody");
      tbody.innerHTML = "";

      if (usersList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="11" class="text-center py-8 text-[#5f6368] dark:text-[#9aa0a6]">Tidak ada data pengguna ditemukan.</td></tr>`;
        return;
      }

      usersList.forEach((u, idx) => {
        const tr = document.createElement("tr");
        tr.className = "hover:bg-[#f8f9fa] dark:hover:bg-[#252525] border-b border-[#f1f3f4] dark:border-[#2d2d2d] transition duration-150";

        const eskalasiChecked = isAccessTrue(u.eskalasi) ? "checked" : "";
        const rkmChecked = isAccessTrue(u.rkm) ? "checked" : "";
        const perbaikanChecked = isAccessTrue(u.perbaikan) ? "checked" : "";
        const taskChecked = isAccessTrue(u.task) ? "checked" : "";
        const syncChecked = isAccessTrue(u.sync) ? "checked" : "";
        const itemChecked = isAccessTrue(u.item) ? "checked" : "";
        const inventoryChecked = isAccessTrue(u.log) ? "checked" : "";
        const assetsChecked = isAccessTrue(u.assets) ? "checked" : "";
        const accesChecked = isAccessTrue(u.acces) ? "checked" : "";

        const userNik = (u.nik || "").trim();
        const userNama = (u.nama || "").trim();

        tr.innerHTML = `
          <td class="px-2 py-2.5 text-center text-[#5f6368] dark:text-[#bdc1c6] font-mono text-xs">${idx + 1}</td>
          <td class="px-3 py-2.5">
            <div class="font-medium text-[#202124] dark:text-[#e8eaed] text-xs">${userNama || '-'}</div>
          </td>
          <td class="px-2.5 py-2.5 text-center">
            <input type="checkbox" onchange="autoSaveAccess('${encodeURIComponent(userNik)}', '${encodeURIComponent(userNama)}', 'eskalasi', this.checked)" ${eskalasiChecked} class="w-3.5 h-3.5 text-[#1a73e8] focus:ring-[#1a73e8] rounded cursor-pointer border-[#dadce0] dark:border-[#5f6368]">
          </td>
          <td class="px-2.5 py-2.5 text-center">
            <input type="checkbox" onchange="autoSaveAccess('${encodeURIComponent(userNik)}', '${encodeURIComponent(userNama)}', 'rkm', this.checked)" ${rkmChecked} class="w-3.5 h-3.5 text-[#1a73e8] focus:ring-[#1a73e8] rounded cursor-pointer border-[#dadce0] dark:border-[#5f6368]">
          </td>
          <td class="px-2.5 py-2.5 text-center">
            <input type="checkbox" onchange="autoSaveAccess('${encodeURIComponent(userNik)}', '${encodeURIComponent(userNama)}', 'perbaikan', this.checked)" ${perbaikanChecked} class="w-3.5 h-3.5 text-[#1a73e8] focus:ring-[#1a73e8] rounded cursor-pointer border-[#dadce0] dark:border-[#5f6368]">
          </td>
          <td class="px-2.5 py-2.5 text-center">
            <input type="checkbox" onchange="autoSaveAccess('${encodeURIComponent(userNik)}', '${encodeURIComponent(userNama)}', 'task', this.checked)" ${taskChecked} class="w-3.5 h-3.5 text-[#1a73e8] focus:ring-[#1a73e8] rounded cursor-pointer border-[#dadce0] dark:border-[#5f6368]">
          </td>
          <td class="px-2.5 py-2.5 text-center">
            <input type="checkbox" onchange="autoSaveAccess('${encodeURIComponent(userNik)}', '${encodeURIComponent(userNama)}', 'sync', this.checked)" ${syncChecked} class="w-3.5 h-3.5 text-[#1a73e8] focus:ring-[#1a73e8] rounded cursor-pointer border-[#dadce0] dark:border-[#5f6368]">
          </td>
          <td class="px-2.5 py-2.5 text-center">
            <input type="checkbox" onchange="autoSaveAccess('${encodeURIComponent(userNik)}', '${encodeURIComponent(userNama)}', 'item', this.checked)" ${itemChecked} class="w-3.5 h-3.5 text-[#1a73e8] focus:ring-[#1a73e8] rounded cursor-pointer border-[#dadce0] dark:border-[#5f6368]">
          </td>
          <td class="px-2.5 py-2.5 text-center">
            <input type="checkbox" onchange="autoSaveAccess('${encodeURIComponent(userNik)}', '${encodeURIComponent(userNama)}', 'log', this.checked)" ${inventoryChecked} class="w-3.5 h-3.5 text-[#1a73e8] focus:ring-[#1a73e8] rounded cursor-pointer border-[#dadce0] dark:border-[#5f6368]">
          </td>
          <td class="px-2.5 py-2.5 text-center">
            <input type="checkbox" onchange="autoSaveAccess('${encodeURIComponent(userNik)}', '${encodeURIComponent(userNama)}', 'assets', this.checked)" ${assetsChecked} class="w-3.5 h-3.5 text-[#1a73e8] focus:ring-[#1a73e8] rounded cursor-pointer border-[#dadce0] dark:border-[#5f6368]">
          </td>
          <td class="px-2.5 py-2.5 text-center">
            <input type="checkbox" onchange="autoSaveAccess('${encodeURIComponent(userNik)}', '${encodeURIComponent(userNama)}', 'acces', this.checked)" ${accesChecked} class="w-3.5 h-3.5 text-[#1a73e8] focus:ring-[#1a73e8] rounded cursor-pointer border-[#dadce0] dark:border-[#5f6368]">
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function autoSaveAccess(encodedNik, encodedNama, fieldName, isChecked) {
      const nik = decodeURIComponent(encodedNik).trim();
      const nama = decodeURIComponent(encodedNama).trim();
      const updatedValue = isChecked ? "Y" : null;

      try {
        let query = supabaseClient
          .from('users')
          .update({ [fieldName]: updatedValue });

        if (nik) {
          query = query.ilike('nik', `%${nik}%`);
        } else {
          query = query.eq('nama', nama);
        }

        const { error } = await query;
        if (error) throw error;

        const targetUser = allUsers.find(u => (nik && u.nik && u.nik.trim() === nik) || (nama && u.nama && u.nama.trim() === nama));
        if (targetUser) {
          targetUser[fieldName] = updatedValue;
        }

        dbFilterOptions = {};
        let displayFieldName = fieldName.toUpperCase();
        if (fieldName === 'log') displayFieldName = 'INVENTORY';
        if (fieldName === 'assets') displayFieldName = 'ASSETS';

        showToast("Tersimpan", `Akses modul ${displayFieldName} untuk ${nama} berhasil diperbarui.`, "success");
      } catch (err) {
        console.error("Auto save access error:", err);
        showToast("Gagal Update", err.message || "Gagal memperbarui hak akses ke Supabase.", "error");
      }
    }

    function toggleFilterMenu(columnKey, event) {
      event.stopPropagation();
      activeFilterColumn = columnKey;

      const popover = document.getElementById('filterPopover');
      const rect = event.currentTarget.getBoundingClientRect();
      
      let leftPos = rect.left + window.scrollX - 100;
      if (leftPos < 8) leftPos = 8;
      const maxLeft = window.innerWidth - 250;
      if (leftPos > maxLeft) leftPos = maxLeft;

      popover.style.top = `${rect.bottom + window.scrollY + 4}px`;
      popover.style.left = `${leftPos}px`;

      document.getElementById('filterSearchInput').value = '';

      if (!dbFilterOptions[columnKey]) {
        if (['eskalasi', 'rkm', 'perbaikan', 'task', 'sync', 'item', 'log', 'assets', 'acces'].includes(columnKey)) {
          dbFilterOptions[columnKey] = ['Aktif', 'Tidak'];
        } else if (columnKey === 'nama') {
          dbFilterOptions[columnKey] = Array.from(new Set(allUsers.map(u => u.nama || '-'))).sort();
        } else if (columnKey === 'no') {
          dbFilterOptions[columnKey] = Array.from(new Set(allUsers.map((_, i) => String(i + 1)))).sort((a, b) => Number(a) - Number(b));
        }
      }

      const activeSaved = filterSelections[activeFilterColumn];
      const allOpts = dbFilterOptions[activeFilterColumn] || [];

      if (activeSaved && activeSaved.size > 0) {
        draftFilterSelections = new Set(activeSaved);
      } else {
        draftFilterSelections = new Set(allOpts);
      }

      renderFilterCheckboxes();
      popover.classList.remove('hidden');
    }

    function closeFilterPopover() {
      document.getElementById('filterPopover').classList.add('hidden');
    }

    function renderFilterCheckboxes() {
      const container = document.getElementById('filterItemsList');
      const searchVal = document.getElementById('filterSearchInput').value.trim().toLowerCase();

      const uniqueValues = dbFilterOptions[activeFilterColumn] || [];

      container.innerHTML = '';

      let visibleCount = 0;
      let visibleCheckedCount = 0;

      uniqueValues.forEach(val => {
        if (searchVal && !val.toLowerCase().includes(searchVal)) return;

        visibleCount++;
        const isChecked = draftFilterSelections.has(val);
        if (isChecked) visibleCheckedCount++;

        const label = document.createElement('label');
        label.className = 'flex items-center gap-2 text-[11px] text-[#202124] dark:text-[#e8eaed] hover:bg-[#e8eaed] dark:hover:bg-[#2d2d2d] p-1 rounded cursor-pointer truncate';
        
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.value = val;
        checkbox.checked = isChecked;
        checkbox.className = 'filter-cb rounded border-[#dadce0] dark:border-[#3c4043] text-[#1a73e8] dark:text-[#8ab4f8] focus:ring-0 bg-transparent';
        
        checkbox.onchange = (e) => {
          if (e.target.checked) {
            draftFilterSelections.add(val);
          } else {
            draftFilterSelections.delete(val);
          }
          updateSelectAllState();
        };

        label.appendChild(checkbox);

        const span = document.createElement('span');
        span.className = 'truncate';
        span.title = val;
        span.innerText = val;
        label.appendChild(span);

        container.appendChild(label);
      });

      const selectAllCb = document.getElementById('selectAllCheckbox');
      if (selectAllCb) {
        selectAllCb.checked = visibleCount > 0 && visibleCheckedCount === visibleCount;
      }
    }

    function updateSelectAllState() {
      const container = document.getElementById('filterItemsList');
      const cbs = container.querySelectorAll('.filter-cb');
      let allChecked = cbs.length > 0;

      cbs.forEach(cb => {
        if (!cb.checked) allChecked = false;
      });

      const selectAllCb = document.getElementById('selectAllCheckbox');
      if (selectAllCb) selectAllCb.checked = allChecked;
    }

    function toggleSelectAllFilters(checked) {
      const container = document.getElementById('filterItemsList');
      const cbs = container.querySelectorAll('.filter-cb');

      cbs.forEach(cb => {
        cb.checked = checked;
        if (checked) {
          draftFilterSelections.add(cb.value);
        } else {
          draftFilterSelections.delete(cb.value);
        }
      });
    }

    function clearFilterColumn() {
      delete filterSelections[activeFilterColumn];
      const allOpts = dbFilterOptions[activeFilterColumn] || [];
      draftFilterSelections = new Set(allOpts);
      
      document.getElementById('filterSearchInput').value = '';
      renderFilterCheckboxes();
      processAndRenderUsers();
    }

    function applyFilter() {
      const allOpts = dbFilterOptions[activeFilterColumn] || [];

      if (draftFilterSelections.size === 0 || draftFilterSelections.size === allOpts.length) {
        delete filterSelections[activeFilterColumn];
      } else {
        filterSelections[activeFilterColumn] = new Set(draftFilterSelections);
      }

      closeFilterPopover();
      processAndRenderUsers();
    }

    function applySort(direction) {
      sortConfig = { column: activeFilterColumn, direction };
      closeFilterPopover();
      processAndRenderUsers();
    }

    function showToast(title, message, type = 'success') {
      const toast = document.getElementById("toast");
      const toastIcon = document.getElementById("toast-icon");
      const toastTitle = document.getElementById("toast-title");
      const toastMsg = document.getElementById("toast-msg");

      if (type === 'success') {
        toast.className = "fixed top-5 right-5 z-[100] transform transition-all duration-300 flex items-center gap-3 px-4 py-3 rounded-2xl shadow-xl border border-[#e6f4ea] dark:border-[#137333]/40 bg-white dark:bg-[#2d2e30] text-[#137333] dark:text-[#81c995] opacity-100 translate-y-0";
        toastIcon.className = "p-1.5 rounded-xl bg-[#e6f4ea] dark:bg-[#137333]/30 text-[#137333] dark:text-[#81c995] shrink-0";
        toastIcon.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>`;
      } else {
        toast.className = "fixed top-5 right-5 z-[100] transform transition-all duration-300 flex items-center gap-3 px-4 py-3 rounded-2xl shadow-xl border border-[#fce8e6] dark:border-[#c5221f]/40 bg-white dark:bg-[#2d2e30] text-[#c5221f] dark:text-[#f28b82] opacity-100 translate-y-0";
        toastIcon.className = "p-1.5 rounded-xl bg-[#fce8e6] dark:bg-[#c5221f]/30 text-[#c5221f] dark:text-[#f28b82] shrink-0";
        toastIcon.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>`;
      }

      toastTitle.textContent = title;
      toastMsg.textContent = message;

      setTimeout(() => {
        toast.classList.remove("opacity-100", "translate-y-0");
        toast.classList.add("opacity-0", "translate-y-[-20px]", "pointer-events-none");
      }, 3000);
    }
  </script>
</body>
