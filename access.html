<head>
  <script>
    (function() {
      try {
        const session = localStorage.getItem("user");
        if (!session) return window.location.replace("login.html"); 
        const userData = JSON.parse(session);
        if (!userData) return window.location.replace("login.html"); 
        window.currentUser = userData.data || userData;
      } catch {
        window.location.replace("login.html");
      }
    })();
  </script>

  <style>
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Roboto', sans-serif;
    }

    /* CUSTOM CSS CHECKBOX BULAT SEMPURNA */
    input[type="checkbox"] {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      width: 0.875rem;
      height: 0.875rem;
      border-radius: 9999px !important;
      border: 1px solid #dadce0;
      outline: none;
      cursor: pointer;
      position: relative;
      transition: all 0.15s ease-in-out;
      display: inline-block;
      vertical-align: middle;
    }

    input[type="checkbox"]:checked {
      background-color: #1a73e8;
      border-color: #1a73e8;
    }

    input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      top: 45%;
      left: 50%;
      width: 3.5px;
      height: 7px;
      border: solid white;
      border-width: 0 1.5px 1.5px 0;
      transform: translate(-50%, -50%) rotate(45deg);
    }

    @media (prefers-color-scheme: dark) {
      input[type="checkbox"] { border-color: #5f6368; }
      input[type="checkbox"]:checked { background-color: #8ab4f8; border-color: #8ab4f8; }
      input[type="checkbox"]:checked::after { border-color: #121212; }
    }

    .floating-scroll-area {
      position: absolute;
      inset: 0;
      overflow-y: scroll;
      overflow-x: auto;
    }

    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent !important; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.25); border-radius: 9999px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.5); }
    .custom-scroll::-webkit-scrollbar-corner { background: transparent; }

    @media (prefers-color-scheme: dark) {
      .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.25); }
      .custom-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.5); }
    }

    #global-header {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 9999;
      pointer-events: none;
    }
    #global-header > * { pointer-events: auto; }
    #global-header aside {
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>

  <script src="header-template.js"></script>

  <script>
    const SUPABASE_URL = "https://sfblelnbczlvykqemhtm.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_9k7sUNqlqhRqjkUtSNpFPQ_VAspSZT0"; 
    
    let supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    let allUsers = [], displayedUsers = [], globalSearchQuery = '';
    let activeFilterColumn = null, filterSelections = {}, draftFilterSelections = new Set(), dbFilterOptions = {};
    let sortConfig = { column: null, direction: null };

    document.addEventListener("DOMContentLoaded", () => {
      if (typeof renderHeader === 'function') renderHeader({ subtitle: "Access Control" });
      fetchUsers();
    });

    document.addEventListener('click', (e) => {
      const popover = document.getElementById('filterPopover');
      if (popover && !popover.classList.contains('hidden') && !popover.contains(e.target) && !e.target.closest('button[onclick*="toggleFilterMenu"]')) {
        closeFilterPopover();
      }
    });

    function isAccessTrue(val) {
      if (!val) return false;
      const str = String(val).trim().toUpperCase();
      return str === "Y" || str === "TRUE" || str === "1";
    }

    async function fetchUsers() {
      const tbody = document.getElementById("userTableBody");
      tbody.innerHTML = `<tr><td colspan="11" class="text-center py-8 text-[#5f6368] dark:text-[#9aa0a6]">Memuat data pengguna...</td></tr>`;

      if (!supabaseClient) return showToast("Error", "Koneksi Supabase tidak tersedia.", "error");

      try {
        const { data, error } = await supabaseClient.from('users').select('*').order('nama', { ascending: true });
        if (error) throw error;

        allUsers = (data || []).filter(u => (u.nama || "").trim().toLowerCase() !== "dede hidayat");
        dbFilterOptions = {};
        processAndRenderUsers();
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="11" class="text-center py-8 text-[#d93025]">Gagal memuat data pengguna dari Supabase.</td></tr>`;
        showToast("Gagal Loading", err.message || "Gagal mengambil data.", "error");
      }
    }

    function triggerGlobalSearch() {
      const val = document.getElementById('globalSearchInput').value.trim();
      globalSearchQuery = val;
      document.getElementById('btnClearSearch').classList.toggle('hidden', val === '');
      processAndRenderUsers();
    }

    function clearGlobalSearch() {
      document.getElementById('globalSearchInput').value = '';
      document.getElementById('btnClearSearch').classList.add('hidden');
      globalSearchQuery = '';
      processAndRenderUsers();
    }

    function processAndRenderUsers() {
      let filtered = [...allUsers];

      if (globalSearchQuery) {
        const q = globalSearchQuery.toLowerCase();
        filtered = filtered.filter(u => u.nama && u.nama.toLowerCase().includes(q));
      }

      for (const colKey in filterSelections) {
        const selectedSet = filterSelections[colKey];
        if (selectedSet?.size > 0) {
          filtered = filtered.filter(u => {
            let val = u[colKey];
            val = ['eskalasi', 'rkm', 'perbaikan', 'task', 'sync', 'log', 'item', 'assets', 'acces'].includes(colKey)
              ? (isAccessTrue(val) ? 'Aktif' : 'Tidak')
              : (val ?? '-');
            return selectedSet.has(String(val));
          });
        }
      }

      if (sortConfig.column && sortConfig.direction) {
        const key = sortConfig.column;
        const dir = sortConfig.direction === 'asc' ? 1 : -1;
        filtered.sort((a, b) => {
          let valA = a[key] || '', valB = b[key] || '';
          if (['eskalasi', 'rkm', 'perbaikan', 'task', 'sync', 'log', 'item', 'assets', 'acces'].includes(key)) {
            valA = isAccessTrue(valA) ? 'Aktif' : 'Tidak';
            valB = isAccessTrue(valB) ? 'Aktif' : 'Tidak';
          }
          return String(valA).localeCompare(String(valB), undefined, { numeric: true, sensitivity: 'base' }) * dir;
        });
      }

      displayedUsers = filtered;
      document.getElementById("userCount").textContent = displayedUsers.length;
      renderUsers(displayedUsers);
    }

    function renderUsers(usersList) {
      const tbody = document.getElementById("userTableBody");
      tbody.innerHTML = "";

      if (usersList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="11" class="text-center py-8 text-[#5f6368]">Tidak ada data pengguna ditemukan.</td></tr>`;
        return;
      }

      const columns = ['eskalasi', 'rkm', 'perbaikan', 'task', 'sync', 'log', 'item', 'assets', 'acces'];

      usersList.forEach((u, idx) => {
        const tr = document.createElement("tr");
        tr.className = "hover:bg-[#f8f9fa] dark:hover:bg-[#252525] border-b border-[#f1f3f4] dark:border-[#2d2d2d] transition duration-150";

        const userNik = (u.nik || "").trim();
        const userNama = (u.nama || "").trim();

        let rowHtml = `
          <td class="px-2 py-2.5 text-center text-[#5f6368] dark:text-[#bdc1c6] font-mono text-xs">${idx + 1}</td>
          <td class="px-3 py-2.5"><div class="font-medium text-[#202124] dark:text-[#e8eaed] text-xs">${userNama || '-'}</div></td>
        `;

        columns.forEach(col => {
          const checked = isAccessTrue(u[col]) ? "checked" : "";
          rowHtml += `
            <td class="px-2.5 py-2.5 text-center">
              <input type="checkbox" onchange="autoSaveAccess('${encodeURIComponent(userNik)}', '${encodeURIComponent(userNama)}', '${col}', this.checked)" ${checked}>
            </td>
          `;
        });

        tr.innerHTML = rowHtml;
        tbody.appendChild(tr);
      });
    }

    async function autoSaveAccess(encodedNik, encodedNama, fieldName, isChecked) {
      const nik = decodeURIComponent(encodedNik).trim();
      const nama = decodeURIComponent(encodedNama).trim();
      const updatedValue = isChecked ? "Y" : null;

      const labelMap = {
        item: 'INVENTORY', log: 'LOGISTICS', acces: 'ACCESS CONTROL', perbaikan: 'DOK. PERBAIKAN'
      };
      const displayFieldName = labelMap[fieldName] || fieldName.toUpperCase();

      try {
        let query = supabaseClient.from('users').update({ [fieldName]: updatedValue });
        query = nik ? query.ilike('nik', `%${nik}%`) : query.eq('nama', nama);

        const { error } = await query;
        if (error) throw error;

        const targetUser = allUsers.find(u => (nik && u.nik?.trim() === nik) || (nama && u.nama?.trim() === nama));
        if (targetUser) targetUser[fieldName] = updatedValue;

        dbFilterOptions = {};
        showToast("Tersimpan", `Akses modul ${displayFieldName} untuk ${nama} berhasil diperbarui.`, "success");
      } catch (err) {
        showToast("Gagal Update", err.message || "Gagal memperbarui ke Supabase.", "error");
      }
    }

    function toggleFilterMenu(columnKey, event) {
      event.stopPropagation();
      activeFilterColumn = columnKey;

      const popover = document.getElementById('filterPopover');
      const rect = event.currentTarget.getBoundingClientRect();
      
      let leftPos = Math.max(8, Math.min(rect.left + window.scrollX - 100, window.innerWidth - 250));

      popover.style.top = `${rect.bottom + window.scrollY + 4}px`;
      popover.style.left = `${leftPos}px`;
      document.getElementById('filterSearchInput').value = '';

      if (!dbFilterOptions[columnKey]) {
        if (['eskalasi', 'rkm', 'perbaikan', 'task', 'sync', 'log', 'item', 'assets', 'acces'].includes(columnKey)) {
          dbFilterOptions[columnKey] = ['Aktif', 'Tidak'];
        } else if (columnKey === 'nama') {
          dbFilterOptions[columnKey] = Array.from(new Set(allUsers.map(u => u.nama || '-'))).sort();
        } else if (columnKey === 'no') {
          dbFilterOptions[columnKey] = Array.from(new Set(allUsers.map((_, i) => String(i + 1)))).sort((a, b) => Number(a) - Number(b));
        }
      }

      const activeSaved = filterSelections[activeFilterColumn];
      draftFilterSelections = activeSaved?.size > 0 ? new Set(activeSaved) : new Set(dbFilterOptions[activeFilterColumn] || []);

      renderFilterCheckboxes();
      popover.classList.remove('hidden');
    }

    function closeFilterPopover() {
      document.getElementById('filterPopover').classList.add('hidden');
    }

    function renderFilterCheckboxes() {
      const container = document.getElementById('filterItemsList');
      const searchVal = document.getElementById('filterSearchInput').value.trim().toLowerCase();
      const uniqueValues = dbFilterOptions[activeFilterColumn] || [];

      container.innerHTML = '';
      let visibleCount = 0, visibleCheckedCount = 0;

      uniqueValues.forEach(val => {
        if (searchVal && !val.toLowerCase().includes(searchVal)) return;

        visibleCount++;
        const isChecked = draftFilterSelections.has(val);
        if (isChecked) visibleCheckedCount++;

        const label = document.createElement('label');
        label.className = 'flex items-center gap-2 text-[11px] text-[#202124] dark:text-[#e8eaed] hover:bg-[#e8eaed] dark:hover:bg-[#2d2d2d] p-1 rounded cursor-pointer truncate';
        
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.value = val;
        checkbox.checked = isChecked;
        checkbox.className = 'filter-cb';
        
        checkbox.onchange = (e) => {
          if (e.target.checked) draftFilterSelections.add(val);
          else draftFilterSelections.delete(val);
          updateSelectAllState();
        };

        label.appendChild(checkbox);
        const span = document.createElement('span');
        span.className = 'truncate';
        span.innerText = val;
        label.appendChild(span);

        container.appendChild(label);
      });

      const selectAllCb = document.getElementById('selectAllCheckbox');
      if (selectAllCb) selectAllCb.checked = visibleCount > 0 && visibleCheckedCount === visibleCount;
    }

    function updateSelectAllState() {
      const cbs = document.querySelectorAll('#filterItemsList .filter-cb');
      const allChecked = cbs.length > 0 && Array.from(cbs).every(cb => cb.checked);
      const selectAllCb = document.getElementById('selectAllCheckbox');
      if (selectAllCb) selectAllCb.checked = allChecked;
    }

    function toggleSelectAllFilters(checked) {
      document.querySelectorAll('#filterItemsList .filter-cb').forEach(cb => {
        cb.checked = checked;
        if (checked) draftFilterSelections.add(cb.value);
        else draftFilterSelections.delete(cb.value);
      });
    }

    function clearFilterColumn() {
      delete filterSelections[activeFilterColumn];
      draftFilterSelections = new Set(dbFilterOptions[activeFilterColumn] || []);
      document.getElementById('filterSearchInput').value = '';
      renderFilterCheckboxes();
      processAndRenderUsers();
    }

    function applyFilter() {
      const allOpts = dbFilterOptions[activeFilterColumn] || [];
      if (draftFilterSelections.size === 0 || draftFilterSelections.size === allOpts.length) {
        delete filterSelections[activeFilterColumn];
      } else {
        filterSelections[activeFilterColumn] = new Set(draftFilterSelections);
      }
      closeFilterPopover();
      processAndRenderUsers();
    }

    function applySort(direction) {
      sortConfig = { column: activeFilterColumn, direction };
      closeFilterPopover();
      processAndRenderUsers();
    }

    function showToast(title, message, type = 'success') {
      const toast = document.getElementById("toast");
      const toastIcon = document.getElementById("toast-icon");

      const isSuccess = type === 'success';
      toast.className = `fixed top-5 right-5 z-[100] transform transition-all duration-300 flex items-center gap-3 px-4 py-3 rounded-2xl shadow-xl border text-xs max-w-md opacity-100 translate-y-0 ${
        isSuccess 
          ? 'border-[#e6f4ea] dark:border-[#137333]/40 bg-white dark:bg-[#2d2e30] text-[#137333] dark:text-[#81c995]' 
          : 'border-[#fce8e6] dark:border-[#c5221f]/40 bg-white dark:bg-[#2d2e30] text-[#c5221f] dark:text-[#f28b82]'
      }`;

      toastIcon.className = `p-1.5 rounded-xl shrink-0 ${
        isSuccess ? 'bg-[#e6f4ea] dark:bg-[#137333]/30 text-[#137333] dark:text-[#81c995]' : 'bg-[#fce8e6] dark:bg-[#c5221f]/30 text-[#c5221f] dark:text-[#f28b82]'
      }`;
      toastIcon.innerHTML = isSuccess
        ? `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>`
        : `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>`;

      document.getElementById("toast-title").textContent = title;
      document.getElementById("toast-msg").textContent = message;

      setTimeout(() => {
        toast.classList.remove("opacity-100", "translate-y-0");
        toast.classList.add("opacity-0", "translate-y-[-20px]", "pointer-events-none");
      }, 3000);
    }
  </script>
</body>
</html>
